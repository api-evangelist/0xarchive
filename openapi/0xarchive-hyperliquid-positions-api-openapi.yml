  /v1/hyperliquid/positions/{symbol}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Positions
      summary: Get Hyperliquid market positions
      description: Every open position in one market at the latest live snapshot, or at the committed hourly snapshot `hour`, sorted by position value, largest first. The first page carries `meta.totals` over the whole filtered set. Billed at 1 credit per 1,000 rows returned, minimum 1 credit per request.
      operationId: getHyperliquidMarketPositions
      parameters:
      - name: symbol
        in: path
        description: Hyperliquid perpetual symbol (e.g. BTC).
        schema:
          type: string
          example: BTC
        required: true
        example: BTC
      - name: hour
        in: query
        description: Committed hourly snapshot to read, as an exact UTC hour in Unix milliseconds. Echoed as `meta.snapshot_ts`. Defaults to the latest live snapshot.
        schema:
          type: integer
          format: int64
        example: 1789999200000
      - name: side
        in: query
        description: Only long or only short positions.
        schema:
          type: string
          enum:
          - long
          - short
      - name: min_value
        in: query
        description: Only positions worth at least this much in USD.
        schema:
          type: number
          minimum: 0
      - name: limit
        in: query
        description: Maximum rows per page (default 100, max 2000).
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 2000
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page. Keep every other parameter unchanged.'
        schema:
          type: string
      responses:
        '200':
          description: Get Hyperliquid market positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMarketPositionArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The snapshot a market cursor was paging has been replaced or has expired (`error_code` `snapshot_advanced`). Restart pagination without a cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 409
                error_code: snapshot_advanced
                error: The snapshot this cursor was paging has been replaced or has expired. Restart pagination without a cursor.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Positions, pagination, or an as-of reconstruction are temporarily unavailable (`error_code` `positions_unavailable`, `pagination_unavailable`, or `reconstruction_unavailable`). Retry shortly.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 503
                error_code: positions_unavailable
                error: Account positions are not available right now.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
        default:
          $ref: '#/components/responses/Error'
