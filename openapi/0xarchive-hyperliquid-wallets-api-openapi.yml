openapi: 3.2.0
info:
  title: 0xArchive Hyperliquid - Wallets API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: Hyperliquid - Wallets
  description: 'Wallet behavioral metrics for Hyperliquid perpetuals: per-wallet profiles and filtered wallet lists.'
paths:
  /v1/hyperliquid/wallets/classify:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Wallets
      summary: Classify Hyperliquid wallets
      description: Return precomputed daily behavioral metrics for active Hyperliquid wallets with filtering, sorting, and pagination. Explicit endpoint cost is 10 credits per request, with row-based metering applied to returned wallet count where enabled.
      operationId: classifyHyperliquidWallets
      parameters:
      - name: min_orders
        in: query
        description: Minimum order count. Default 100.
        schema:
          type: integer
          format: int64
          default: 100
      - name: min_volume_usd
        in: query
        description: Minimum fill volume in USD.
        schema:
          type: number
          default: 0
      - name: sort
        in: query
        description: Metric to sort by.
        schema:
          type: string
          default: total_orders
          enum:
          - total_orders
          - total_fills
          - total_volume
          - total_volume_usd
          - cancel_rate
          - fill_rate
          - maker_ratio
          - avg_order_size_usd
          - avg_order_notional
          - max_order_size_usd
          - max_order_notional
          - active_hours
          - unique_coins
          - total_fees
          - total_fees_usd
          - realized_pnl
          - realized_pnl_usd
          - median_cancel_speed_ms
          - twap_fills
          - total_priority_gas
          - total_priority_gas_paid
          - total_builder_fees
          - total_builder_fees_paid
      - name: order
        in: query
        description: Sort order.
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      - name: limit
        in: query
        description: 'Maximum wallets to return (default: 100, max: 1000).'
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      - name: offset
        in: query
        description: Pagination offset. Capped at 100000.
        schema:
          type: integer
          default: 0
          maximum: 100000
      - name: uses_twap
        in: query
        description: Filter wallets by TWAP usage.
        schema:
          type: boolean
      - name: uses_priority_gas
        in: query
        description: Filter wallets by priority-gas usage.
        schema:
          type: boolean
      - name: min_cancel_rate
        in: query
        description: Minimum cancel rate, from 0.0 to 1.0.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: max_cancel_rate
        in: query
        description: Maximum cancel rate, from 0.0 to 1.0.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: date
        in: query
        description: Daily snapshot date (YYYY-MM-DD). Defaults to yesterday.
        schema:
          type: string
          format: date
          example: '2026-06-16'
      responses:
        '200':
          description: Wallet classification results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWalletClassifyData'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/wallets/{address}/profile:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Wallets
      summary: Get Hyperliquid wallet profile
      description: 'Behavioral metrics for one wallet on Hyperliquid perpetuals over the last `hours`: order mix (cancel, fill, IOC, post-only, TP/SL, and trigger ratios), order sizes, cancel speed, fill volume and maker share, fees, realized PnL, liquidations, and TWAP, client order ID, priority gas, and builder usage. Without `coin`, metrics come from daily aggregates: every UTC day that overlaps the window counts in full, and `unique_coins_traded` and `unique_fill_coins` are the largest single-day counts. With `coin`, the window is exact.'
      operationId: getHyperliquidWalletProfile
      security:
      - ApiKeyAuth: []
      parameters:
      - name: address
        in: path
        required: true
        description: 'Wallet address: 0x followed by 40 hex characters (case-insensitive).'
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
        example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
      - name: coin
        in: query
        description: Limit the metrics to one perpetual market (case-insensitive, e.g., BTC). Omit for all markets.
        schema:
          type: string
          example: BTC
      - name: hours
        in: query
        description: Lookback window in hours, from 1 to 168 (7 days). Larger values are capped at 168.
        schema:
          type: integer
          default: 24
          minimum: 1
          maximum: 168
      responses:
        '200':
          description: Wallet behavioral metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWalletProfile'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Without `coin`: the wallet placed no orders in the window.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                error: No data found for 0x0000000000000000000000000000000000000001
                error_code: not_found
                request_id: 01883301-c6eb-4b06-9f0e-cd568ec81309
                success: false
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    WalletClassifyMetrics:
      type: object
      description: Precomputed wallet behavior metrics.
      additionalProperties: false
      properties:
        total_orders:
          type: integer
          format: int64
        cancel_rate:
          type: number
        fill_rate:
          type: number
        order_to_trade_ratio:
          type: number
        ioc_ratio:
          type: number
        post_only_ratio:
          type: number
        tpsl_ratio:
          type: number
        trigger_order_ratio:
          type: number
        unique_coins_traded:
          type: integer
          format: int64
        uses_tpsl:
          type: boolean
        uses_builder:
          type: boolean
        top_builder:
          type: string
          description: Builder address this wallet routed the most orders through. Omitted when the wallet used no builder.
        avg_order_size_usd:
          type: number
        max_order_size_usd:
          type: number
        median_cancel_speed_ms:
          type: number
        active_hours:
          type: integer
          format: int64
        total_fills:
          type: integer
          format: int64
        total_volume_usd:
          type: number
        maker_ratio:
          type: number
        long_short_ratio:
          type: number
        buy_volume_usd:
          type: number
        sell_volume_usd:
          type: number
        total_fees_usd:
          type: number
        realized_pnl_usd:
          type: number
        liquidation_count:
          type: integer
          format: int64
        max_single_fill_usd:
          type: number
        unique_fill_coins:
          type: integer
          format: int64
        uses_twap:
          type: boolean
        twap_fill_ratio:
          type: number
        uses_cloid:
          type: boolean
        cloid_ratio:
          type: number
        uses_priority_gas:
          type: boolean
        total_priority_gas_paid:
          type: number
        total_builder_fees_paid:
          type: number
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    WalletProfile:
      type: object
      properties:
        address:
          type: string
          description: Wallet address, lowercase.
        metrics:
          $ref: '#/components/schemas/WalletProfileMetrics'
        period:
          type: string
          description: Lookback window that was applied, for example `24h`.
          example: 24h
    ApiResponseWalletClassifyData:
      type: object
      description: API response containing bulk wallet classification results.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WalletClassifyData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WalletProfileMetrics:
      type: object
      description: Behavioral metrics for one wallet. Ratios run from 0 to 1 unless noted; USD values use fill or order price times size.
      properties:
        total_orders:
          type: integer
          description: Orders placed.
        cancel_rate:
          type: number
          description: Share of orders canceled.
        fill_rate:
          type: number
          description: Share of orders filled.
        order_to_trade_ratio:
          type: number
          description: Orders placed per fill (0 when there are no fills).
        ioc_ratio:
          type: number
          description: Share of orders that are immediate-or-cancel.
        post_only_ratio:
          type: number
          description: Share of orders that are post-only.
        tpsl_ratio:
          type: number
          description: Share of orders that are position TP/SL orders.
        trigger_order_ratio:
          type: number
          description: Share of orders that are trigger orders.
        unique_coins_traded:
          type: integer
          description: Markets with orders.
        uses_tpsl:
          type: boolean
          description: True when the wallet placed any position TP/SL order.
        uses_builder:
          type: boolean
          description: True when any order went through a builder.
        top_builder:
          type: string
          description: Builder address with the most orders. Omitted when no order used a builder.
        avg_order_size_usd:
          type: number
          description: Average order notional in USD.
        max_order_size_usd:
          type: number
          description: Largest order notional in USD.
        median_cancel_speed_ms:
          type: number
          description: Median time from placement to cancel, in milliseconds.
        active_hours:
          type: integer
          description: Hours with at least one order.
        total_fills:
          type: integer
          description: Fills.
        total_volume_usd:
          type: number
          description: Fill volume in USD.
        maker_ratio:
          type: number
          description: Share of fill volume that was maker volume.
        long_short_ratio:
          type: number
          description: Buy volume divided by sell volume (0 when there is no sell volume). Not bounded by 1.
        buy_volume_usd:
          type: number
          description: Buy fill volume in USD.
        sell_volume_usd:
          type: number
          description: Sell fill volume in USD.
        total_fees_usd:
          type: number
          description: Fees paid, net of rebates.
        realized_pnl_usd:
          type: number
          description: Realized PnL from closing fills.
        liquidation_count:
          type: integer
          description: Fills that were liquidations.
        max_single_fill_usd:
          type: number
          description: Largest single fill in USD.
        unique_fill_coins:
          type: integer
          description: Markets with fills.
        uses_twap:
          type: boolean
          description: True when any fill came from a TWAP.
        twap_fill_ratio:
          type: number
          description: Share of fills that came from a TWAP.
        uses_cloid:
          type: boolean
          description: True when any fill carried a client order ID.
        cloid_ratio:
          type: number
          description: Share of fills that carried a client order ID.
        uses_priority_gas:
          type: boolean
          description: True when any fill paid priority gas.
        total_priority_gas_paid:
          type: number
          description: Priority gas paid.
        total_builder_fees_paid:
          type: number
          description: Builder and deployer fees paid.
    ResponseMeta:
      type: object
      description: Response metadata. Every 2xx JSON response carries `meta.request_id`; list payloads add `count`; cursor-paged routes add `has_more` and, when another page follows, `next_cursor`; per-symbol routes add `symbol` and `venue`. Fields that do not apply to a route are omitted.
      properties:
        count:
          type: integer
          description: Number of records returned
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        next_cursor:
          type: string
          description: Opaque cursor for the next page, present exactly when `has_more` is `true`. Pass it back unchanged as `cursor` with the same filters. Do not parse or construct it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        finalized_through:
          type: string
          format: date-time
          description: 'Two-tier datasets (Lighter trades): data at or before this instant is final; later data is preliminary.'
        requested_end:
          type:
          - string
          - 'null'
          format: date-time
          description: The `end` the request asked for, echoed when it was clamped to `finalized_through`.
        clamped_to:
          type:
          - string
          - 'null'
          format: date-time
          description: The boundary the request's `end` was clamped to, when clamping occurred.
        preliminary_row_count:
          type:
          - integer
          - 'null'
          description: Number of preliminary rows in this response, on routes that intentionally serve preliminary data (Lighter `/recent`).
      required:
      - request_id
    ApiMeta:
      allOf:
      - $ref: '#/components/schemas/ResponseMeta'
      deprecated: true
      description: Deprecated name of `ResponseMeta`, kept so existing references resolve.
      type: object
      properties:
        count:
          type: integer
          description: Number of records returned
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for pagination (timestamp). Use this value as the `cursor` parameter to fetch the next page of results.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        has_more:
          type: boolean
          description: 'Present on cursor-paged routes: true when another page exists. `next_cursor` is present exactly when it is true.'
        symbol:
          type: string
          description: 'Present on per-symbol routes: the symbol the response covers.'
        venue:
          type: string
          description: 'Present on per-symbol routes: the venue the response covers, for example `hyperliquid` or `hip3`.'
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code. Branch on this value, not on the `error` text.


        **Contract codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_parameter` | 400 | A parameter failed to parse or validate. `param` names it and `valid_values` lists accepted values where the set is fixed. |

        | `invalid_symbol` | 400 | The symbol is not listed on this venue. |

        | `invalid_interval` | 400 | The `interval` (bucket width) is not one this route accepts. |

        | `invalid_cursor` | 400 | The `cursor` is malformed, stale, or was issued for other filters. Restart pagination without a cursor. Trades, liquidations, L2 and L4 diffs, order history and TP/SL routes currently return the first page for a malformed cursor instead. |

        | `invalid_time_range` | 400 | `start` is after `end`, or a time value could not be parsed. |

        | `range_before_coverage` | 400 | The whole requested range ends before the first instant this dataset is served from. |

        | `historical_range_exceeded` | 403 | The requested span is longer than the plan allows in one request or replay. |

        | `historical_depth_exceeded` | 403 | The request reaches further back than the plan''s history window. |

        | `unsupported_for_venue` | 404 | The venue does not offer this datatype. The message, `datatype` and `available_on` name where it is served. |

        | `route_not_found` | 404 | No route matches the path or method. `GET /v1/capabilities` lists the routes each venue serves. |

        | `not_found` | 404 | The route exists but the requested resource (for example an incident, endpoint or outcome id) does not. |

        | `unauthorized` | 401 | The API key is missing or invalid. |

        | `forbidden` | 403 | The key is valid but not allowed to make this request. |

        | `insufficient_credits` | 429 | The monthly credit allowance is spent (402 on pay-per-request routes). |

        | `rate_limited` | 429 | Too many requests or concurrent queries. Retry after the interval in the rate-limit headers. |

        | `conflict` | 409 | The request conflicts with the current state of the resource. |

        | `upstream_unavailable` | 503 | A dependency is unavailable or saturated. Retry shortly; the response carries `Retry-After`. |

        | `internal_error` | 500 | An unexpected server error. Quote `request_id` when contacting support. |


        **WebSocket only** (sent in `{"type":"error"}` messages, never by REST)


        | Code | Where | Meaning |

        |---|---|---|

        | `endpoint_unsupported` | WebSocket | This WebSocket endpoint does not serve the channel or operation. The message names the endpoint that does. |

        | `slow_consumer` | WebSocket | The connection fell behind a stream and messages were dropped. Re-subscribe, or restart the replay, to resynchronise. |


        **Route-specific codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `positions_unavailable` | 503 | Account positions are temporarily unavailable for this venue. |

        | `reconstruction_unavailable` | 503 | The as-of positions state for this instant cannot be reconstructed right now. |

        | `snapshot_advanced` | 409 | A positions market cursor pinned a snapshot that has since been replaced or expired. Restart pagination. |

        | `pagination_unavailable` | 503 | The next positions page cannot be served right now. Retry the same cursor shortly. |

        | `api_key_limit_reached` | 403 | The account already holds the maximum number of API keys for its plan. |

        | `wallet_requires_plan` | 402 | A wallet-authenticated key needs an active plan for this request. |

        | `wallet_account_required` | 403 | Wallet sign-in needs an existing account linked to the wallet. |

        | `wallet_free_signup_retired` | 410 | Free wallet sign-up is no longer offered. |

        | `account_disabled` | 403 | The account is disabled. |

        | `oauth_not_permitted` | 403 | This route is not available to OAuth access tokens. |

        | `insufficient_scope` | 403 | The OAuth access token lacks the scope this route requires. |


        **Legacy names.** Requests without `0xArchive-Version: 2026-10-01` keep the four names that predate the contract; with the header they receive the contract names instead.


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_query_params` | 400 | Legacy name of `invalid_parameter` (query parameter), or of `invalid_cursor` when the parameter is `cursor`, sent without the version header. |

        | `invalid_path_params` | 400 | Legacy name of `invalid_parameter` (path parameter), sent without the version header. |

        | `history_window_exceeded` | 403 | Legacy name of `historical_depth_exceeded`, sent without the version header. |

        | `request_range_exceeded` | 403 | Legacy name of `historical_range_exceeded`, sent without the version header. |


        Treat any value not listed here as a generic error of the HTTP status.'
      enum:
      - invalid_parameter
      - invalid_symbol
      - invalid_interval
      - invalid_cursor
      - invalid_time_range
      - range_before_coverage
      - historical_range_exceeded
      - historical_depth_exceeded
      - unsupported_for_venue
      - route_not_found
      - not_found
      - unauthorized
      - forbidden
      - insufficient_credits
      - rate_limited
      - conflict
      - upstream_unavailable
      - internal_error
      - endpoint_unsupported
      - slow_consumer
      - positions_unavailable
      - reconstruction_unavailable
      - snapshot_advanced
      - pagination_unavailable
      - api_key_limit_reached
      - wallet_requires_plan
      - wallet_account_required
      - wallet_free_signup_retired
      - account_disabled
      - oauth_not_permitted
      - insufficient_scope
      - invalid_query_params
      - invalid_path_params
      - history_window_exceeded
      - request_range_exceeded
      example: invalid_parameter
    ApiResponseWalletProfile:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WalletProfile'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    WalletClassifyData:
      type: object
      description: Bulk wallet classification response body.
      required:
      - wallets
      - total
      - date
      properties:
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/ClassifiedWallet'
        total:
          type: integer
          format: int64
          description: Total wallets matching the filters.
          example: 4444
        date:
          type: string
          description: Daily snapshot date.
          example: '2026-06-16'
    ClassifiedWallet:
      type: object
      description: Wallet plus its precomputed behavior metrics.
      required:
      - address
      - metrics
      - period
      properties:
        address:
          type: string
          description: Wallet address.
          example: '0x010461c14e146ac35fe42271bdc1134ee31c703a'
        metrics:
          $ref: '#/components/schemas/WalletClassifyMetrics'
        period:
          type: string
          description: Metric lookback period.
          example: 24h
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 2
    ApiVersion:
      description: The contract version the response was shaped with. Present only when the request sent `0xArchive-Version`.
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  responses:
    Unauthorized:
      description: 'Authentication required: the API key is missing or invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: 401
            error_code: unauthorized
            error: Missing authentication credentials. Provide X-API-Key header or Bearer token.
            request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Forbidden:
      description: The request is outside the plan's history window or per-request span, or the key is not allowed to make it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            historical_depth_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_depth_exceeded
                error: 'Your plan includes the most recent 30 days of history: this request starts at 2026-01-01T00:00:00Z, before the earliest allowed timestamp 2026-08-30T00:00:00Z. Requests cannot be chunked across the age boundary.'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            historical_range_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_range_exceeded
                error: Maximum range is 30 days per request on your plan. Requested range is 45 days.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Error:
      description: Any other error. The body is an `ErrorResponse`; branch on `error_code`. A 503 (`upstream_unavailable`) carries `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstream_unavailable:
              value:
                success: false
                code: 503
                error_code: upstream_unavailable
                error: The service is temporarily unavailable. Retry shortly.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            internal_error:
              value:
                success: false
                code: 500
                error_code: internal_error
                error: Internal server error
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    RateLimited:
      description: Rate limit, concurrency limit or monthly credits exceeded. See `error_code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                success: false
                code: 429
                error_code: rate_limited
                error: Rate limit exceeded
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            insufficient_credits:
              value:
                success: false
                code: 429
                error_code: insufficient_credits
                error: Monthly credit limit exceeded. Please upgrade your plan.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                credits_used: 50000
                credits_limit: 50000
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Requests per second limit
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests this second
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    BadRequest:
      description: 'Invalid request: a parameter, symbol, interval, cursor or time range failed validation. See `error_code`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_parameter:
              value:
                success: false
                code: 400
                error_code: invalid_parameter
                error: Invalid side 'up'. Use buy or sell.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: side
                valid_values:
                - buy
                - sell
            invalid_symbol:
              value:
                success: false
                code: 400
                error_code: invalid_symbol
                error: The symbol 'ZZZ' does not exist. Please see /v1/hyperliquid/instruments for available symbols.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: symbol
            invalid_time_range:
              value:
                success: false
                code: 400
                error_code: invalid_time_range
                error: start must be <= end
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            legacy_invalid_query_params:
              value:
                success: false
                code: 400
                error_code: invalid_query_params
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            current_main:
              value:
                code: 400
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                error_code: invalid_query_params
                param: limit
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                success: false
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
  parameters:
    ApiVersion:
      name: 0xArchive-Version
      in: header
      required: false
      description: 'Selects the 2026-10 response contract. Send `2026-10-01`; any dated version on or after it selects the same shapes. Without the header every response keeps its existing shape. With it:


        - The data quality routes, `/v1/status/coverage` and `/v1/symbols` answer the standard `{success, data, meta}` envelope.

        - Record times that are integer milliseconds by default become RFC 3339 UTC strings with millisecond precision, and the integer moves to a `*_ms` field: L4 resting-order `timestamp` (`timestamp_ms`), CVD buckets, HIP-3 oracle reads, Lighter and Lighter on Robinhood Chain liquidations and liquidation volume. Levels and trigger-levels `snapshot_ts` become RFC 3339 with `snapshot_ts_ms`.

        - Error bodies carry the contract `error_code` names: `invalid_parameter` instead of `invalid_query_params` and `invalid_path_params`, `historical_depth_exceeded` instead of `history_window_exceeded`, and `historical_range_exceeded` instead of `request_range_exceeded`; a malformed cursor that fails to parse answers 400 `invalid_cursor` instead of `invalid_query_params`. With `0xArchive-Version: 2026-10-01`, malformed cursors on trades, liquidations, L2 and L4 diffs, order history, TP/SL and order-flow routes answer 400 `invalid_cursor`. Without the header, the first six route families treat a malformed cursor as no cursor and return the first page; order flow answers 400 `invalid_query_params`. Malformed trade time inputs answer 400 `invalid_time_range` with the header and 400 `invalid_query_params` without it.


        The response echoes the selected version in its own `0xArchive-Version` header.'
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Get yours at https://0xarchive.io/dashboard
