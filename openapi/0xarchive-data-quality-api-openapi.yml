      description: 'Keys added to the default body of the data quality routes and `/v1/status/coverage`: `success` first and `meta.request_id` last. The rest of the body is unchanged. With `0xArchive-Version: 2026-10-01` the body is the standard envelope instead, with the route''s own object under `data`.'
      required:
