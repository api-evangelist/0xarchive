        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/positions:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Positions
      summary: Get all Hyperliquid positions
      description: 'Every open position across all markets at one committed hourly snapshot (default: the latest), for bulk loading. Each row carries `snapshot_ts`. Billed at 1 credit per 1,000 rows returned, minimum 1 credit per request.'
      operationId: getHyperliquidAllPositions
      parameters:
      - name: hour
        in: query
        description: Committed hourly snapshot to read, as an exact UTC hour in Unix milliseconds. Defaults to the latest committed hour.
        schema:
          type: integer
          format: int64
        example: 1789999200000
      - name: limit
        in: query
        description: Maximum rows per page (default 1000; max 2000 as JSON, 50,000 as Arrow).
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 50000
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page. Keep every other parameter unchanged.'
        schema:
          type: string
      - name: format
        in: query
        description: '`arrow` returns an Apache Arrow IPC stream (`application/vnd.apache.arrow.stream`) with up to 50,000 rows per page and the page metadata in the `x-count`, `x-next-cursor`, and `x-schema-version: positions.v1` headers, where Arrow output is enabled for this route; otherwise the response is JSON. Sending `Accept: application/vnd.apache.arrow.stream` has the same effect.'
        schema:
          type: string
          enum:
          - json
          - arrow
      responses:
        '200':
          description: Get all Hyperliquid positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMarketPositionArray'
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                format: binary
                description: Apache Arrow IPC stream of `MarketPosition` rows (schema version `positions.v1`).
          headers:
            x-count:
              schema:
                type: integer
              description: 'Arrow responses: rows in this page.'
            x-next-cursor:
              schema:
                type: string
              description: 'Arrow responses: cursor for the next page, absent on the last page.'
            x-schema-version:
              schema:
                type: string
              description: 'Arrow responses: `positions.v1`.'
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The snapshot a market cursor was paging has been replaced or has expired (`error_code` `snapshot_advanced`). Restart pagination without a cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 409
                error_code: snapshot_advanced
                error: The snapshot this cursor was paging has been replaced or has expired. Restart pagination without a cursor.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Positions, pagination, or an as-of reconstruction are temporarily unavailable (`error_code` `positions_unavailable`, `pagination_unavailable`, or `reconstruction_unavailable`). Retry shortly.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 503
                error_code: positions_unavailable
                error: Account positions are not available right now.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    PositionChange:
      type: object
      description: 'One leg of the position change log: a trade, liquidation, auto-deleverage, or settlement that changed (or touched) a position, with the position before and after. Hyperliquid legs carry `direction`, `closed_pnl`, `crossed`, and `seq`; Lighter legs carry `realized_pnl`, `is_maker`, and the Lighter fields at the end.'
      required:
      - timestamp
      - symbol
      - coin
      - side
      - price
      - size
      - start_position
      - end_position
      - entry_price_after
      - event_type
      - cause
      - fee
      - fee_token
      - trade_id
      - order_id
      - opened_at
      - continuity
      - finalized
      properties:
        timestamp:
          type: string
          format: date-time
          description: Execution time (UTC).
          example: '2026-09-25T14:03:11.482Z'
        account_index:
          type: string
          description: 'Lighter only: account index as a string.'
          example: '513030'
        account_kind:
          type: string
          description: 'Lighter only: `user`, `insurance`, `settlement`, or `system`.'
          example: user
        symbol:
          type: string
          description: 'Market symbol (HIP-3: `dex:COIN`).'
          example: BTC
        coin:
          type: string
          description: Alias of `symbol`.
          example: BTC
        dex:
          type: string
          description: 'HIP-3 only: dex of the market.'
          example: xyz
        side:
          type: string
          enum:
          - B
          - A
          description: 'Side of this account in the trade, exactly as on the trades routes: `B` (buy) or `A` (sell).'
          example: B
        price:
          type:
          - string
          - 'null'
          description: Execution price.
          example: '65010.2'
        size:
          type:
          - string
          - 'null'
          description: Traded size in base units.
          example: '0.25'
        start_position:
          type:
          - string
          - 'null'
          description: Signed position size before the leg.
          example: '-0.5'
        end_position:
          type:
          - string
          - 'null'
          description: Signed position size after the leg.
          example: '-0.25'
        entry_price_after:
          type:
          - string
          - 'null'
          description: Average entry price after the leg. Null when the position is flat after it.
          example: '64210.5'
        event_type:
          type: string
          description: 'Effect on the position: `open`, `increase`, `reduce`, `close`, or `flip`. Lighter also reports `settlement` (the settlement counterparty side of a market settlement) and `unchanged`.'
          example: reduce
        cause:
          type: string
          description: 'Why the leg happened: `trade`, `liquidation`, `liquidation_counterparty`, `adl`, `settlement`, or `unknown`.'
          example: trade
        direction:
          type: string
          description: 'Hyperliquid and HIP-3 only: direction label as reported by Hyperliquid (for example `Close Short`).'
          example: Close Short
        closed_pnl:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: realized PnL of the leg in USD.'
          example: '19.9'
        realized_pnl:
          type: string
          description: 'Lighter only: realized PnL of the leg in the quote asset (0 on open and increase).'
          example: '19.9'
        fee:
          type:
          - string
          - 'null'
          description: Fee paid for the leg (negative is a rebate).
          example: '0.4875'
        fee_token:
          type: string
          description: 'Asset the fee is paid in: USDC on Hyperliquid and Lighter mainnet, USDG on Lighter on Robinhood Chain.'
          example: USDC
        crossed:
          type: boolean
          description: 'Hyperliquid and HIP-3 only: true when this account was the taker.'
          example: true
        is_maker:
          type: boolean
          description: 'Lighter only: true when this account was the maker.'
          example: false
        trade_id:
          type: integer
          format: int64
          description: Trade ID, shared by both legs of a trade.
          example: 26121110211
        order_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Order ID of this account.
          example: 844421856609148
        opened_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start of the position lifecycle this leg belongs to. Null when it opened before coverage.
        seq:
          type: integer
          description: 'Hyperliquid and HIP-3 only: order of legs that share a timestamp.'
          example: 0
        block_number:
          type: integer
          format: int64
          description: 'Hyperliquid and HIP-3 only, present when known (from September 17, 2026): block that executed the leg.'
          example: 745512345
        event_index:
          type: integer
          description: 'Hyperliquid and HIP-3 only, present with `block_number`: execution order within the block.'
          example: 12
        continuity:
          type: string
          enum:
          - ok
          - inferred
          - first_seen
          - quarantined
          description: '`ok` when `start_position` continues the previous leg exactly, `inferred` when it was bridged, `first_seen` for the first leg recorded for the account and market, `quarantined` when the chain is broken and the leg is held out of position state.'
          example: ok
        position_size_before:
          type: string
          description: 'Lighter only: alias of `start_position`.'
          example: '-0.5'
        position_size_after:
          type: string
          description: 'Lighter only: alias of `end_position`.'
          example: '-0.25'
        fee_rate:
          type:
          - string
          - 'null'
          description: 'Lighter only: fee rate as a decimal ratio.'
          example: '0.00002'
        fee_usdc:
          type:
          - string
          - 'null'
          description: 'Lighter only: fee in the quote asset, computed from the notional and the fee rate.'
          example: '0.325'
        usdc_amount:
          type: string
          description: 'Lighter only: notional of the leg in the quote asset.'
          example: '16252.55'
        finalized:
          type: boolean
          description: True when the leg is final and will not be re-derived.
          example: true
    ApiResponseMarketPositionArray:
      type: object
      description: Open positions in a market or across markets.
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketPosition'
        meta:
          $ref: '#/components/schemas/PositionsMeta'
    PositionsMeta:
      type: object
      description: Response metadata of the account positions routes. Every instant is RFC 3339 UTC with milliseconds and comes from the data, never the request time.
      required:
      - count
      - request_id
      properties:
        count:
          type: integer
          description: Number of records returned.
        next_cursor:
          type:
          - string
          - 'null'
          description: Signed, opaque cursor for the next page, bound to the request; present exactly when `has_more` is `true`. Pass it back with the same parameters. A market cursor pins its snapshot; if that snapshot is replaced or expires the next page answers 409 `snapshot_advanced`.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        as_of:
          type: string
          format: date-time
          description: 'Instant the returned state describes: the snapshot tick or hour, or the requested as-of time.'
        snapshot_ts:
          type: string
          format: date-time
          description: Committed snapshot the response was read from. Market routes echo the resolved `hour` here.
        source:
          type: string
          enum:
          - snapshot
          - reconstructed
          - changes
          description: 'How the rows were produced: `snapshot` (live or hourly snapshot), `reconstructed` (as-of state between snapshots), or `changes` (change log).'
        quality:
          type: string
          description: 'Completeness of the snapshot the response was read from: `complete`, `partial`, or `degraded`. Rows carry their own `quality`. On Lighter and Robinhood Chain, snapshots from the latest day, before the venue''s daily trade reconcile, can read `degraded` while their rows read `preliminary`; they read `complete` once the reconcile has run.'
        stale:
          type: boolean
          description: True on current reads when the latest snapshot is older than 12 minutes; paired with `notice`.
        built_through:
          type: string
          format: date-time
          description: Every event before this instant is built into the change log and as-of state. Reads are clamped to it.
        finalized_through:
          type: string
          format: date-time
          description: 'Every event before this instant is final and will not be re-derived (Lighter: the trade finalization watermark). Never later than `built_through`.'
        requested_end:
          type: string
          format: date-time
          description: The `end` or `timestamp` the caller asked for, echoed when the read was clamped.
        clamped_to:
          type: string
          format: date-time
          description: Boundary the read was clamped to (`built_through`). Present only when clamped.
        totals:
          allOf:
          - $ref: '#/components/schemas/MarketPositionsSummary'
          description: 'Market listings, first page only: aggregates over the whole filtered result set, not just this page.'
        coverage_from:
          type: string
          format: date-time
          description: Coverage start, present with `notice` when the request falls before coverage or the address has no recorded activity.
        notice:
          type: string
          description: 'Human-readable advisory: before coverage, no recorded activity, or a stale snapshot.'
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    MarketPosition:
      type: object
      description: 'One open position in a market-wide listing (`/positions/{symbol}` and bulk `/positions`). A lean record: use the wallet or account routes for the full `Position`.'
      required:
      - symbol
      - coin
      - size
      - side
      - entry_price
      - mark_price
      - position_value
      - unrealized_pnl
      - leverage_type
      - liquidation_price
      - quality
      properties:
        snapshot_ts:
          type: string
          format: date-time
          description: Hour the row describes. Present on bulk `/positions` rows.
        user_address:
          type: string
          description: 'Hyperliquid and HIP-3 only: wallet address holding the position (lowercase).'
          example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
        account_index:
          type: string
          description: 'Lighter only: account index as a string.'
          example: '513030'
        account_kind:
          type: string
          description: 'Lighter only: `user`, `insurance`, `settlement`, or `system`.'
          example: user
        symbol:
          type: string
          description: 'Market symbol (HIP-3: `dex:COIN`).'
          example: BTC
        coin:
          type: string
          description: Alias of `symbol`.
          example: BTC
        dex:
          type: string
          description: 'HIP-3 only: dex of the market.'
          example: xyz
        size:
          type: string
          description: Signed position size in base units.
          example: '12.5'
        side:
          type: string
          enum:
          - long
          - short
          example: long
        entry_price:
          type:
          - string
          - 'null'
          description: Average entry price.
          example: '64210.5'
        mark_price:
          type:
          - string
          - 'null'
          description: Mark price.
          example: '65020.1'
        position_value:
          type:
          - string
          - 'null'
          description: Absolute position value in USD. Listings sort by this value, largest first.
          example: '812751.25'
        unrealized_pnl:
          type:
          - string
          - 'null'
          description: Unrealized PnL in USD.
          example: '10120.2'
        leverage_type:
          type: string
          description: '`cross`, `isolated`, or `unknown` (Lighter: the margin mode).'
          example: cross
        liquidation_price:
          type:
          - string
          - 'null'
          description: Reported liquidation price. Hyperliquid only; null on Lighter.
          example: '51000'
        quality:
          type: string
          description: Quality of this row. `complete`, `partial` (a mark or entry is missing, so value and PnL fields are null), or `degraded`. Lighter rows can also read `preliminary` (built from real-time trades not yet reconciled), `unreconciled` (a market with no reconciled trades), or `incomplete`. No row reads `complete` when its own data is not complete, or when its snapshot has a problem that could not be pinned to specific rows. A small number of Hyperliquid positions around three short windows in June and July 2025, where Hyperliquid's published fill data has gaps, read `partial`.
          example: complete
    Position:
      type: object
      description: One open position. Numbers are decimal strings (sizes to the market size precision, prices to the market price precision, USD values to 6 decimals); a flat position serializes as `"0"`. Hyperliquid rows carry `dex` on HIP-3; Lighter rows carry `account_index`, `account_kind`, and the Lighter fields at the end. Fields a source does not report are null, never estimated.
      required:
      - symbol
      - coin
      - size
      - side
      - entry_price
      - mark_price
      - mark_time
      - position_value
      - unrealized_pnl
      - return_on_equity
      - leverage
      - max_leverage
      - margin_used
      - liquidation_price
      - liquidation_price_status
      - cum_funding
      - opened_at
      - snapshot_as_of
      - quality
      properties:
        snapshot_ts:
          type: string
          format: date-time
          description: Hour the row describes. Present on hourly history rows only.
        account_index:
          type: string
          description: 'Lighter only: account index, serialized as a string because it can exceed JavaScript integers.'
          example: '281474976710654'
        account_kind:
          type: string
          description: 'Lighter only: `user`, `insurance`, `settlement`, or `system`. Non-user accounts appear in market routes only with `include_system=true`.'
          example: user
        symbol:
          type: string
          description: 'Market symbol (HIP-3: `dex:COIN`).'
          example: BTC
        coin:
          type: string
          description: Alias of `symbol`.
          example: BTC
        dex:
          type: string
          description: 'HIP-3 only: the dex the position belongs to.'
          example: xyz
        size:
          type: string
          description: Signed position size in base units (negative is short).
          example: '-0.5'
        side:
          type: string
          enum:
          - long
          - short
          description: Position side.
          example: short
        entry_price:
          type:
          - string
          - 'null'
          description: Average entry price.
          example: '64210.5'
        mark_price:
          type:
          - string
          - 'null'
          description: Mark price used for value and PnL. Null when no mark is available.
          example: '65020.1'
        mark_time:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of the mark price.
        position_value:
          type:
          - string
          - 'null'
          description: Absolute position value in USD at the mark price.
          example: '32510.05'
        unrealized_pnl:
          type:
          - string
          - 'null'
          description: Unrealized PnL in USD at the mark price.
          example: '-404.8'
        return_on_equity:
          type:
          - string
          - 'null'
          description: Return on equity as a decimal ratio. Hyperliquid snapshot rows only.
          example: '-0.1245'
        leverage:
          $ref: '#/components/schemas/PositionLeverage'
        max_leverage:
          type:
          - integer
          - 'null'
          description: Maximum leverage allowed for the market. Hyperliquid snapshot rows only.
          example: 40
        margin_used:
          type:
          - string
          - 'null'
          description: Margin allocated to the position in USD. Hyperliquid snapshot rows only.
          example: '1625.5'
        liquidation_price:
          type:
          - string
          - 'null'
          description: Liquidation price as reported for the position. Hyperliquid snapshot rows only.
          example: '81250'
        liquidation_price_status:
          type: string
          description: 'How `liquidation_price` should be read: `exact`, `not_published_cross`, `changed_since_snapshot`, or `unavailable` (always `unavailable` on Lighter and on as-of reconstructions).'
          example: exact
        cum_funding:
          $ref: '#/components/schemas/PositionCumulativeFunding'
        opened_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start of the current position lifecycle. Null when it opened before coverage.
        snapshot_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: Time the leverage, margin, and funding fields describe, which can differ from the hour. Hyperliquid snapshot rows only.
        quality:
          type: string
          description: Quality of this row. `complete`, `partial` (a mark or entry is missing, so value and PnL fields are null), or `degraded`. Lighter rows can also read `preliminary` (built from real-time trades not yet reconciled), `unreconciled` (a market with no reconciled trades), or `incomplete`. No row reads `complete` when its own data is not complete, or when its snapshot has a problem that could not be pinned to specific rows. A small number of Hyperliquid positions around three short windows in June and July 2025, where Hyperliquid's published fill data has gaps, read `partial`.
          example: complete
        initial_margin_fraction:
          type:
          - string
          - 'null'
          description: 'Lighter only: initial margin fraction at the last trade, as a decimal ratio.'
          example: '0.05'
        allocated_margin:
          type:
          - string
          - 'null'
          description: 'Lighter only: isolated margin allocated to the position.'
          example: '1200.5'
        margin_mode:
          type: string
          description: 'Lighter only: `cross`, `isolated`, or `unknown`.'
          example: cross
        mark_source:
          type: string
          description: 'Lighter only: where the mark came from: `mark`, `last_trade`, `stale_mark`, or `none`.'
          example: mark
        finalized:
          type: boolean
          description: 'Lighter only: true when every trade behind the row is final (reconciled).'
          example: true
    PositionLeverage:
      type: object
      description: Leverage of a position.
      required:
      - type
      - value
      properties:
        type:
          type: string
          description: 'Margin type: `cross`, `isolated`, or `unknown`. On Lighter this is the margin mode of the position.'
          example: cross
        value:
          type:
          - string
          - 'null'
          description: Leverage multiple as a decimal string. Null when unknown (Lighter rows and as-of reconstructions).
          example: '20'
    ApiResponseMarketPositionsSummaryArray:
      type: object
      description: 'Market long/short aggregates: one point now, or one per hour.'
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketPositionsSummary'
        meta:
          $ref: '#/components/schemas/PositionsMeta'
    AccountSummary:
      type: object
      description: 'Account summary. Hyperliquid and HIP-3 carry the perp clearinghouse fields of one account (HIP-3: one per dex). Lighter carries position aggregates only (`account_index`, totals, and counts). A total is null when any position in it has no mark, never a partial sum.'
      required:
      - total_position_value
      - total_unrealized_pnl
      - long_value
      - short_value
      - n_positions
      - quality
      properties:
        snapshot_ts:
          type: string
          format: date-time
          description: Hour the row describes. Present on hourly history rows only.
        account_index:
          type: string
          description: 'Lighter only: account index as a string.'
          example: '513030'
        dex:
          type: string
          description: 'HIP-3 only: dex the account summary belongs to.'
          example: xyz
        account_value:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: account value in USD.'
          example: '125000.5'
        cross_account_value:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: cross-margin account value in USD.'
          example: '118000.25'
        collateral:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: collateral in USD.'
          example: '100000'
        total_margin_used:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: total margin used in USD.'
          example: '20500.75'
        cross_maintenance_margin_used:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: cross maintenance margin used in USD.'
          example: '6100.2'
        withdrawable:
          type:
          - string
          - 'null'
          description: 'Hyperliquid and HIP-3 only: withdrawable amount in USD. Null outside the periods where it was captured.'
        total_position_value:
          type:
          - string
          - 'null'
          description: Sum of absolute position values in USD.
          example: '412000.5'
        total_unrealized_pnl:
          type:
          - string
          - 'null'
          description: Sum of unrealized PnL in USD.
          example: '2510.25'
        long_value:
          type:
          - string
          - 'null'
          description: Value of long positions in USD.
          example: '300000'
        short_value:
          type:
          - string
          - 'null'
          description: Value of short positions in USD.
          example: '112000.5'
        n_positions:
          type: integer
          description: Number of open positions.
          example: 4
        account_mode:
          type: string
          description: 'Hyperliquid and HIP-3 only: account abstraction mode, `standard`, `unified`, `portfolio`, `dex_abstraction`, or `unknown`.'
          example: standard
        snapshot_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Hyperliquid and HIP-3 only: time the clearinghouse fields describe.'
        quality:
          type: string
          description: '`complete`, `partial` (a total is null because a position has no mark), or `degraded`.'
          example: complete
    TimeInput:
      description: 'An instant: Unix milliseconds, or an RFC 3339 string such as `2026-01-01T00:00:00Z` (encode a `+` offset as `%2B`). An unparsable value answers 400 `invalid_time_range`.'
      oneOf:
      - type: integer
        format: int64
        description: Unix milliseconds.
        example: 1767225600000
      - type: string
        format: date-time
        description: RFC 3339 instant.
        example: '2026-01-01T00:00:00Z'
    ApiResponseAccountSummaryArray:
      type: object
      description: 'Account summaries (current: one per account or HIP-3 dex; history: one per hour).'
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        meta:
          $ref: '#/components/schemas/PositionsMeta'
    ApiResponseWalletPositions:
      type: object
      description: Positions of one wallet or account.
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WalletPositions'
        meta:
          $ref: '#/components/schemas/PositionsMeta'
    WalletPositions:
      type: object
      description: Positions of one wallet or account at one instant.
      required:
      - positions
      - account
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        account:
          allOf:
          - $ref: '#/components/schemas/AccountSummary'
          description: 'Account summary on the first page of a snapshot read. Hyperliquid core: the wallet''s summary when the snapshot holds one. HIP-3: when the request is scoped to one dex. Lighter: position aggregates when no `symbol` filter is set. Null otherwise, on later pages, and on as-of reconstructions.'
        account_seen:
          type: string
          enum:
          - flat
          - never_seen
          - outside_coverage
          description: 'Present only when `positions` is empty: `flat` (activity is recorded but no position is open), `never_seen` (no recorded activity in the covered history, with `meta.notice` and `meta.coverage_from`), or `outside_coverage` (the requested instant is before coverage).'
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code. Branch on this value, not on the `error` text.


        **Contract codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_parameter` | 400 | A parameter failed to parse or validate. `param` names it and `valid_values` lists accepted values where the set is fixed. |

        | `invalid_symbol` | 400 | The symbol is not listed on this venue. |

        | `invalid_interval` | 400 | The `interval` (bucket width) is not one this route accepts. |

        | `invalid_cursor` | 400 | The `cursor` is malformed, stale, or was issued for other filters. Restart pagination without a cursor. Trades, liquidations, L2 and L4 diffs, order history and TP/SL routes currently return the first page for a malformed cursor instead. |

        | `invalid_time_range` | 400 | `start` is after `end`, or a time value could not be parsed. |

        | `range_before_coverage` | 400 | The whole requested range ends before the first instant this dataset is served from. |

        | `historical_range_exceeded` | 403 | The requested span is longer than the plan allows in one request or replay. |

        | `historical_depth_exceeded` | 403 | The request reaches further back than the plan''s history window. |

        | `unsupported_for_venue` | 404 | The venue does not offer this datatype. The message, `datatype` and `available_on` name where it is served. |

        | `route_not_found` | 404 | No route matches the path or method. `GET /v1/capabilities` lists the routes each venue serves. |

        | `not_found` | 404 | The route exists but the requested resource (for example an incident, endpoint or outcome id) does not. |

        | `unauthorized` | 401 | The API key is missing or invalid. |

        | `forbidden` | 403 | The key is valid but not allowed to make this request. |

        | `insufficient_credits` | 429 | The monthly credit allowance is spent (402 on pay-per-request routes). |

        | `rate_limited` | 429 | Too many requests or concurrent queries. Retry after the interval in the rate-limit headers. |

        | `conflict` | 409 | The request conflicts with the current state of the resource. |

        | `upstream_unavailable` | 503 | A dependency is unavailable or saturated. Retry shortly; the response carries `Retry-After`. |

        | `internal_error` | 500 | An unexpected server error. Quote `request_id` when contacting support. |


        **WebSocket only** (sent in `{"type":"error"}` messages, never by REST)


        | Code | Where | Meaning |

        |---|---|---|

        | `endpoint_unsupported` | WebSocket | This WebSocket endpoint does not serve the channel or operation. The message names the endpoint that does. |

        | `slow_consumer` | WebSocket | The connection fell behind a stream and messages were dropped. Re-subscribe, or restart the replay, to resynchronise. |


        **Route-specific codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `positions_unavailable` | 503 | Account positions are temporarily unavailable for this venue. |

        | `reconstruction_unavailable` | 503 | The as-of positions state for this instant cannot be reconstructed right now. |

        | `snapshot_advanced` | 409 | A positions market cursor pinned a snapshot that has since been replaced or expired. Restart pagination. |

        | `pagination_unavailable` | 503 | The next positions page cannot be served right now. Retry the same cursor shortly. |

        | `api_key_limit_reached` | 403 | The account already holds the maximum number of API keys for its plan. |

        | `wallet_requires_plan` | 402 | A wallet-authenticated key needs an active plan for this request. |

        | `wallet_account_required` | 403 | Wallet sign-in needs an existing account linked to the wallet. |

        | `wallet_free_signup_retired` | 410 | Free wallet sign-up is no longer offered. |

        | `account_disabled` | 403 | The account is disabled. |

        | `oauth_not_permitted` | 403 | This route is not available to OAuth access tokens. |

        | `insufficient_scope` | 403 | The OAuth access token lacks the scope this route requires. |


        **Legacy names.** Requests without `0xArchive-Version: 2026-10-01` keep the four names that predate the contract; with the header they receive the contract names instead.


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_query_params` | 400 | Legacy name of `invalid_parameter` (query parameter), or of `invalid_cursor` when the parameter is `cursor`, sent without the version header. |

        | `invalid_path_params` | 400 | Legacy name of `invalid_parameter` (path parameter), sent without the version header. |

        | `history_window_exceeded` | 403 | Legacy name of `historical_depth_exceeded`, sent without the version header. |

        | `request_range_exceeded` | 403 | Legacy name of `historical_range_exceeded`, sent without the version header. |


        Treat any value not listed here as a generic error of the HTTP status.'
      enum:
      - invalid_parameter
      - invalid_symbol
      - invalid_interval
      - invalid_cursor
      - invalid_time_range
      - range_before_coverage
      - historical_range_exceeded
      - historical_depth_exceeded
      - unsupported_for_venue
      - route_not_found
      - not_found
      - unauthorized
      - forbidden
      - insufficient_credits
      - rate_limited
      - conflict
      - upstream_unavailable
      - internal_error
      - endpoint_unsupported
      - slow_consumer
      - positions_unavailable
      - reconstruction_unavailable
      - snapshot_advanced
      - pagination_unavailable
      - api_key_limit_reached
      - wallet_requires_plan
      - wallet_account_required
      - wallet_free_signup_retired
      - account_disabled
      - oauth_not_permitted
      - insufficient_scope
      - invalid_query_params
      - invalid_path_params
      - history_window_exceeded
      - request_range_exceeded
      example: invalid_parameter
    MarketPositionsSummary:
      type: object
      description: Long and short aggregates of every open position in one market at one snapshot. Averages cover only positions with a known entry (`*_positions_with_entry`). Shares are decimal ratios of the side or total value held by the ten largest positions.
      required:
      - snapshot_ts
      - symbol
      - coin
      - long_count
      - short_count
      - long_size
      - short_size
      - long_value
      - short_value
      - long_avg_entry_price
      - short_avg_entry_price
      - long_positions_with_entry
      - short_positions_with_entry
      - long_top10_value_share
      - short_top10_value_share
      - top10_value_share
      - quality
      properties:
        snapshot_ts:
          type:
          - string
