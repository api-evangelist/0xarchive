openapi: 3.2.0
info:
  title: 0xArchive HIP-3 Builder Perps - Breadth API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: HIP-3 Builder Perps - Breadth
  description: 'HIP-3 market breadth snapshots: percentage of eligible instruments trading above their current UTC-session VWAP.'
paths:
  /v1/hyperliquid/hip3/breadth/above-vwap/current:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-3 Builder Perps - Breadth
      summary: Get current HIP-3 breadth above session VWAP
      description: Get the latest validated aggregate percentage of eligible HIP-3 instruments trading above their current UTC-session VWAP. Each instrument contributes one vote; VWAP uses candle quote volume divided by base volume and compares the last completed 1-minute candle close. The session resets at 00:00 UTC. Instruments with no session volume or a last completed candle older than 5 minutes are excluded, so coverage varies by market hours. `value_pct` is null when no instruments are eligible, never 0. HIP-3 `namespaces` maps are keyed by builder namespace when counts are nonzero; this route is aggregate-only and does not expose per-symbol VWAPs. Validated snapshots are stored every minute when the calculation passes its invariants; failed or invalid calculations do not create a row. `calculated_at` is the UTC cutoff used to calculate the validated snapshot, not a source-freshness guarantee. HIP-3 history begins 2026-08-28; there is no pre-launch history.
      operationId: getHip3BreadthAboveVwapCurrent
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Current HIP-3 breadth snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBreadthSnapshot'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/hip3/breadth/above-vwap:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-3 Builder Perps - Breadth
      summary: Get HIP-3 breadth above session VWAP history
      description: Get historical aggregate HIP-3 breadth snapshots. Each row reports the percentage of eligible instruments above their current UTC-session VWAP and its auditable counts. Eligibility excludes instruments with no session volume or a last completed candle older than 5 minutes, so coverage varies by market hours. `start` and `end` are Unix timestamps in milliseconds. If omitted, `start` defaults independently to now minus 24 hours and `end` defaults to now; the start default is not derived from a supplied `end`. The optional `interval` downsamples by selecting the last stored snapshot in each bucket; percentages are never averaged because the denominator can vary. The optional `cursor` is an epoch-millisecond timestamp from `meta.next_cursor` and is exclusive. Validated snapshots are stored every minute when the calculation passes its invariants; failed or invalid calculations do not create a row. `calculated_at` is the UTC cutoff used to calculate each validated snapshot, not a source-freshness guarantee. HIP-3 history begins 2026-08-28; there is no pre-launch history.
      operationId: getHip3BreadthAboveVwap
      parameters:
      - name: start
        in: query
        description: Start timestamp. Defaults independently to now minus 24 hours; this default is not derived from a supplied `end`. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: end
        in: query
        description: End timestamp. Defaults to now. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page.'
        schema:
          type: string
      - name: limit
        in: query
        description: 'Maximum number of snapshots (default: 100, max: 1000).'
        schema:
          type: integer
          default: 100
          maximum: 1000
      - name: interval
        in: query
        description: Optional aggregation interval. Downsampled intervals select the last stored snapshot in each bucket; percentages are never averaged.
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Historical HIP-3 breadth snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBreadthSnapshotArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 2
    ApiVersion:
      description: The contract version the response was shaped with. Present only when the request sent `0xArchive-Version`.
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  responses:
    BadRequest:
      description: 'Invalid request: a parameter, symbol, interval, cursor or time range failed validation. See `error_code`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_parameter:
              value:
                success: false
                code: 400
                error_code: invalid_parameter
                error: Invalid side 'up'. Use buy or sell.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: side
                valid_values:
                - buy
                - sell
            invalid_symbol:
              value:
                success: false
                code: 400
                error_code: invalid_symbol
                error: The symbol 'ZZZ' does not exist. Please see /v1/hyperliquid/instruments for available symbols.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: symbol
            invalid_time_range:
              value:
                success: false
                code: 400
                error_code: invalid_time_range
                error: start must be <= end
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            legacy_invalid_query_params:
              value:
                success: false
                code: 400
                error_code: invalid_query_params
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            current_main:
              value:
                code: 400
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                error_code: invalid_query_params
                param: limit
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                success: false
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Unauthorized:
      description: 'Authentication required: the API key is missing or invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: 401
            error_code: unauthorized
            error: Missing authentication credentials. Provide X-API-Key header or Bearer token.
            request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Error:
      description: Any other error. The body is an `ErrorResponse`; branch on `error_code`. A 503 (`upstream_unavailable`) carries `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstream_unavailable:
              value:
                success: false
                code: 503
                error_code: upstream_unavailable
                error: The service is temporarily unavailable. Retry shortly.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            internal_error:
              value:
                success: false
                code: 500
                error_code: internal_error
                error: Internal server error
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Forbidden:
      description: The request is outside the plan's history window or per-request span, or the key is not allowed to make it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            historical_depth_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_depth_exceeded
                error: 'Your plan includes the most recent 30 days of history: this request starts at 2026-01-01T00:00:00Z, before the earliest allowed timestamp 2026-08-30T00:00:00Z. Requests cannot be chunked across the age boundary.'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            historical_range_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_range_exceeded
                error: Maximum range is 30 days per request on your plan. Requested range is 45 days.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    NotFound:
      description: 'Not found. `not_found`: the resource id is unknown. `unsupported_for_venue`: the venue does not offer this datatype (`available_on` names where it is served). `route_not_found`: no route matches the path.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                success: false
                code: 404
                error_code: not_found
                error: Resource not found
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            unsupported_for_venue:
              value:
                success: false
                code: 404
                error_code: unsupported_for_venue
                error: Order flow is not offered on Hyperliquid spot. It is available on Hyperliquid (/v1/hyperliquid/orders/{symbol}/flow), HIP-3 (/v1/hyperliquid/hip3/orders/{symbol}/flow) and HIP-4 (/v1/hyperliquid/hip4/orders/{symbol}/flow).
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                venue: spot
                datatype: order_flow
                available_on:
                - venue: hyperliquid
                  route: /v1/hyperliquid/orders/{symbol}/flow
                - venue: hip3
                  route: /v1/hyperliquid/hip3/orders/{symbol}/flow
                - venue: hip4
                  route: /v1/hyperliquid/hip4/orders/{symbol}/flow
            route_not_found:
              value:
                success: false
                code: 404
                error_code: route_not_found
                error: No route matches GET /v1/not-a-route. GET /v1/capabilities lists the routes each venue serves.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            current_main:
              value:
                code: 404
                error: No L4 checkpoint available before requested timestamp
                error_code: not_found
                request_id: ad7df471-eb8a-477c-bd9f-c685a9825f5b
                success: false
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    RateLimited:
      description: Rate limit, concurrency limit or monthly credits exceeded. See `error_code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                success: false
                code: 429
                error_code: rate_limited
                error: Rate limit exceeded
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            insufficient_credits:
              value:
                success: false
                code: 429
                error_code: insufficient_credits
                error: Monthly credit limit exceeded. Please upgrade your plan.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                credits_used: 50000
                credits_limit: 50000
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Requests per second limit
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests this second
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
  schemas:
    ApiResponseBreadthSnapshot:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BreadthSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      description: Response metadata. Every 2xx JSON response carries `meta.request_id`; list payloads add `count`; cursor-paged routes add `has_more` and, when another page follows, `next_cursor`; per-symbol routes add `symbol` and `venue`. Fields that do not apply to a route are omitted.
      properties:
        count:
          type: integer
          description: Number of records returned
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        next_cursor:
          type: string
          description: Opaque cursor for the next page, present exactly when `has_more` is `true`. Pass it back unchanged as `cursor` with the same filters. Do not parse or construct it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        finalized_through:
          type: string
          format: date-time
          description: 'Two-tier datasets (Lighter trades): data at or before this instant is final; later data is preliminary.'
        requested_end:
          type:
          - string
          - 'null'
          format: date-time
          description: The `end` the request asked for, echoed when it was clamped to `finalized_through`.
        clamped_to:
          type:
          - string
          - 'null'
          format: date-time
          description: The boundary the request's `end` was clamped to, when clamping occurred.
        preliminary_row_count:
          type:
          - integer
          - 'null'
          description: Number of preliminary rows in this response, on routes that intentionally serve preliminary data (Lighter `/recent`).
      required:
      - request_id
    TimeInput:
      description: 'An instant: Unix milliseconds, or an RFC 3339 string such as `2026-01-01T00:00:00Z` (encode a `+` offset as `%2B`). An unparsable value answers 400 `invalid_time_range`.'
      oneOf:
      - type: integer
        format: int64
        description: Unix milliseconds.
        example: 1767225600000
      - type: string
        format: date-time
        description: RFC 3339 instant.
        example: '2026-01-01T00:00:00Z'
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    BreadthCounts:
      type: object
      description: Auditable counts behind an aggregate Hyperliquid core perpetual or HIP-3 breadth snapshot.
      required:
      - candidates
      - eligible
      - above
      - at
      - below
      - excluded_no_session_volume
      - excluded_stale_price
      properties:
        candidates:
          type: integer
          format: int32
          minimum: 0
          description: Cumulative candidate instruments considered at this calculation cutoff. This is not a fixed inventory, and candidate counts are not guaranteed to be monotonic across historical snapshots.
        eligible:
          type: integer
          format: int32
          minimum: 0
          description: Eligible instruments included in the headline percentage.
        above:
          type: integer
          format: int32
          minimum: 0
          description: Eligible instruments trading above their current UTC-session VWAP.
        at:
          type: integer
          format: int32
          minimum: 0
          description: Eligible instruments at their current UTC-session VWAP.
        below:
          type: integer
          format: int32
          minimum: 0
          description: Eligible instruments trading below their current UTC-session VWAP.
        excluded_no_session_volume:
          type: integer
          format: int32
          minimum: 0
          description: Candidates excluded because the current UTC session has no qualifying volume.
        excluded_stale_price:
          type: integer
          format: int32
          minimum: 0
          description: Candidates with session volume excluded because their most recent completed 1-minute candle close was older than the 5-minute freshness threshold at the calculation cutoff. Candidates without session volume are counted only in excluded_no_session_volume.
    BreadthNamespaceCounts:
      type: object
      description: Per-namespace count breakdowns for the shared core and HIP-3 breadth shape. Core perpetual responses always return empty maps. HIP-3 responses use builder namespace keys where counts are nonzero, so an individual map may be empty.
      required:
      - eligible
      - above
      - at
      - below
      properties:
        eligible:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          description: Eligible instrument counts by builder namespace for HIP-3; always empty for core perpetuals.
        above:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          description: Above-VWAP instrument counts by builder namespace for HIP-3; always empty for core perpetuals.
        at:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          description: At-VWAP instrument counts by builder namespace for HIP-3; always empty for core perpetuals.
        below:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          description: Below-VWAP instrument counts by builder namespace for HIP-3; always empty for core perpetuals.
    ApiResponseBreadthSnapshotArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/BreadthSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BreadthSnapshot:
      type: object
      description: Aggregate percentage of eligible Hyperliquid core perpetual or HIP-3 instruments trading above their current UTC-session VWAP. The same validated snapshot shape is used for both families; per-symbol VWAPs are not served.
      required:
      - session_date
      - calculated_at
      - value_pct
      - coverage_ratio
      - counts
      - namespaces
      properties:
        session_date:
          type: string
          format: date
          description: UTC session date.
        calculated_at:
          type: string
          format: date-time
          description: UTC calculation cutoff for this validated snapshot. It identifies the cutoff used for included candle data and is not a source-freshness guarantee.
        value_pct:
          type:
          - number
          - 'null'
          format: double
          description: 100 times above divided by eligible; null when eligible is zero and never interpret null as 0%.
        coverage_ratio:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Eligible divided by candidates, constrained to the range 0..1.
        counts:
          $ref: '#/components/schemas/BreadthCounts'
        namespaces:
          $ref: '#/components/schemas/BreadthNamespaceCounts'
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code. Branch on this value, not on the `error` text.


        **Contract codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_parameter` | 400 | A parameter failed to parse or validate. `param` names it and `valid_values` lists accepted values where the set is fixed. |

        | `invalid_symbol` | 400 | The symbol is not listed on this venue. |

        | `invalid_interval` | 400 | The `interval` (bucket width) is not one this route accepts. |

        | `invalid_cursor` | 400 | The `cursor` is malformed, stale, or was issued for other filters. Restart pagination without a cursor. Trades, liquidations, L2 and L4 diffs, order history and TP/SL routes currently return the first page for a malformed cursor instead. |

        | `invalid_time_range` | 400 | `start` is after `end`, or a time value could not be parsed. |

        | `range_before_coverage` | 400 | The whole requested range ends before the first instant this dataset is served from. |

        | `historical_range_exceeded` | 403 | The requested span is longer than the plan allows in one request or replay. |

        | `historical_depth_exceeded` | 403 | The request reaches further back than the plan''s history window. |

        | `unsupported_for_venue` | 404 | The venue does not offer this datatype. The message, `datatype` and `available_on` name where it is served. |

        | `route_not_found` | 404 | No route matches the path or method. `GET /v1/capabilities` lists the routes each venue serves. |

        | `not_found` | 404 | The route exists but the requested resource (for example an incident, endpoint or outcome id) does not. |

        | `unauthorized` | 401 | The API key is missing or invalid. |

        | `forbidden` | 403 | The key is valid but not allowed to make this request. |

        | `insufficient_credits` | 429 | The monthly credit allowance is spent (402 on pay-per-request routes). |

        | `rate_limited` | 429 | Too many requests or concurrent queries. Retry after the interval in the rate-limit headers. |

        | `conflict` | 409 | The request conflicts with the current state of the resource. |

        | `upstream_unavailable` | 503 | A dependency is unavailable or saturated. Retry shortly; the response carries `Retry-After`. |

        | `internal_error` | 500 | An unexpected server error. Quote `request_id` when contacting support. |


        **WebSocket only** (sent in `{"type":"error"}` messages, never by REST)


        | Code | Where | Meaning |

        |---|---|---|

        | `endpoint_unsupported` | WebSocket | This WebSocket endpoint does not serve the channel or operation. The message names the endpoint that does. |

        | `slow_consumer` | WebSocket | The connection fell behind a stream and messages were dropped. Re-subscribe, or restart the replay, to resynchronise. |


        **Route-specific codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `positions_unavailable` | 503 | Account positions are temporarily unavailable for this venue. |

        | `reconstruction_unavailable` | 503 | The as-of positions state for this instant cannot be reconstructed right now. |

        | `snapshot_advanced` | 409 | A positions market cursor pinned a snapshot that has since been replaced or expired. Restart pagination. |

        | `pagination_unavailable` | 503 | The next positions page cannot be served right now. Retry the same cursor shortly. |

        | `api_key_limit_reached` | 403 | The account already holds the maximum number of API keys for its plan. |

        | `wallet_requires_plan` | 402 | A wallet-authenticated key needs an active plan for this request. |

        | `wallet_account_required` | 403 | Wallet sign-in needs an existing account linked to the wallet. |

        | `wallet_free_signup_retired` | 410 | Free wallet sign-up is no longer offered. |

        | `account_disabled` | 403 | The account is disabled. |

        | `oauth_not_permitted` | 403 | This route is not available to OAuth access tokens. |

        | `insufficient_scope` | 403 | The OAuth access token lacks the scope this route requires. |


        **Legacy names.** Requests without `0xArchive-Version: 2026-10-01` keep the four names that predate the contract; with the header they receive the contract names instead.


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_query_params` | 400 | Legacy name of `invalid_parameter` (query parameter), or of `invalid_cursor` when the parameter is `cursor`, sent without the version header. |

        | `invalid_path_params` | 400 | Legacy name of `invalid_parameter` (path parameter), sent without the version header. |

        | `history_window_exceeded` | 403 | Legacy name of `historical_depth_exceeded`, sent without the version header. |

        | `request_range_exceeded` | 403 | Legacy name of `historical_range_exceeded`, sent without the version header. |


        Treat any value not listed here as a generic error of the HTTP status.'
