openapi: 3.2.0
info:
  title: 0xArchive Hyperliquid - Positions API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: Hyperliquid - Positions
  description: 'Hyperliquid core perpetual positions by wallet address: current and as-of positions, account summaries, hourly history, the position change log, and market-wide listings. Change log from May 25, 2025 15:00 UTC; hourly history from June 7, 2026 18:00 UTC; live snapshots every 5 minutes.'
paths:
  /v1/hyperliquid/wallets/{address}/positions:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Positions
      summary: Get Hyperliquid wallet positions
      description: 'Open positions of one wallet: the latest live snapshot, or the state at `timestamp`. Hyperliquid core also returns the account summary on the first page of a snapshot read. An empty result reports `account_seen`. The change log starts May 25, 2025 15:00 UTC, so as-of reads reach back to then; hourly history starts June 7, 2026 18:00 UTC; live snapshots refresh every 5 minutes. Billed at 1 credit per 1,000 rows returned, minimum 1 credit per request.'
      operationId: getHyperliquidWalletPositions
      parameters:
      - name: address
        in: path
        description: 'Wallet address: 0x followed by 40 hex characters (case-insensitive).'
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
        required: true
        example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
      - name: timestamp
        in: query
        description: 'As-of instant: the state after every event before it. An exact hour with a committed snapshot serves that snapshot; any other instant is reconstructed (`meta.source: reconstructed`) and clamped to `meta.built_through`. Omit for the latest live snapshot. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.'
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: symbol
        in: query
        description: Only this perpetual (e.g. BTC).
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum rows per page (default 500, max 5000).
        schema:
          type: integer
          default: 500
          minimum: 1
          maximum: 5000
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page. Keep every other parameter unchanged.'
        schema:
          type: string
      responses:
        '200':
          description: Get Hyperliquid wallet positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWalletPositions'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Positions, pagination, or an as-of reconstruction are temporarily unavailable (`error_code` `positions_unavailable`, `pagination_unavailable`, or `reconstruction_unavailable`). Retry shortly.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 503
                error_code: positions_unavailable
                error: Account positions are not available right now.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/wallets/{address}/positions/history:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Hyperliquid - Positions
      summary: Get Hyperliquid wallet position history
      description: Hourly position rows of one wallet in `[start, end)`, one row per open position per committed hour, each with `snapshot_ts`. The change log starts May 25, 2025 15:00 UTC, so as-of reads reach back to then; hourly history starts June 7, 2026 18:00 UTC; live snapshots refresh every 5 minutes. Billed at 1 credit per 1,000 rows returned, minimum 1 credit per request.
      operationId: getHyperliquidWalletPositionsHistory
      parameters:
      - name: address
        in: path
        description: 'Wallet address: 0x followed by 40 hex characters (case-insensitive).'
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
        required: true
        example: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
      - name: start
        in: query
        description: Inclusive start. Defaults to 24 hours before `end`. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: end
        in: query
        description: Exclusive end. Defaults to now. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: symbol
        in: query
        description: Only this perpetual (e.g. BTC).
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum rows per page (default 500, max 5000).
        schema:
          type: integer
          default: 500
          minimum: 1
          maximum: 5000
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page. Keep every other parameter unchanged.'
        schema:
          type: string
      responses:
        '200':
          description: Get Hyperliquid wallet position history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePositionArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Positions, pagination, or an as-of reconstruction are temporarily unavailable (`error_code` `positions_unavailable`, `pagination_unavailable`, or `reconstruction_unavailable`). Retry shortly.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 503
                error_code: positions_unavailable
                error: Account positions are not available right now.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
        default:
          $ref: '#/components/responses/Error'
