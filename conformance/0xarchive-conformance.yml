domain_standards:
  note: >-
    REWARD-ONLY check. Crypto market data has no ratified cross-venue interchange standard - no
    FIX-equivalent, no ISO 20022 message set, no OpenRTB analogue governs perpetual-futures or
    prediction-market tick data. What exists instead are the VENUE protocols, and 0xArchive
    conforms to those in the only way a data aggregator can: it faithfully reproduces each venue's
    own market structure and naming rather than flattening them into a house schema.
  entries:
  - id: hyperliquid-hip3
    name: Hyperliquid HIP-3 builder-deployed perpetuals
    conforms: true
    evidence:
      location: openapi/0xarchive-openapi.json
      detail: >-
        13 tags and 34 operations under /v1/hyperliquid/hip3, preserving HIP-3's case-sensitive
        builder:NAME coin identifier verbatim rather than normalising it, plus builder-specific
        surfaces (oracle discovery-bounds, external-price, breadth above-VWAP) that only exist
        because HIP-3 markets are builder-deployed.
  - id: hyperliquid-hip4
    name: Hyperliquid HIP-4 outcome markets
    conforms: true
    evidence:
      location: openapi/0xarchive-openapi.json
      detail: >-
        7 tags and 22 operations under /v1/hyperliquid/hip4, encoding HIP-4's <10*outcome_id +
        side> coin identity, exposing outcome and question resources as first-class entities, and
        correctly modelling the fact that fully-collateralized binary outcomes have no funding and
        no liquidations - and that candle prices are probabilities in 0..1, not prices.
  - id: lighter-l3
    name: Lighter order-level (L3) book
    conforms: true
    evidence:
      location: openapi/0xarchive-openapi.json
      detail: >-
        /v1/lighter/l3orderbook/{symbol} exposes Lighter's native L3 order-level depth with
        individual order ids and user addresses, alongside Hyperliquid's L4 reconstruction -
        the contract keeps the two venues' distinct book depths distinct rather than
        down-levelling both to L2.
