replay_semantics:
  timed:
    speed_range: 10x (Free) to 300x (Scale), from 500x on Enterprise
    controls: [replay.pause, replay.resume, replay.seek, replay.stop]
  checkpoint_anchored_bulk:
    applies_to: [l4_diffs, l4_orders]
    speed: ignored
    seek: rejected
    ordering: process l4_snapshot before l4_batch
  lighter_tick_mode:
    event: historical_tick_data
    ordering: checkpoint first, then deltas
  rest_only:
    - Lighter liquidation events are REST-only and have no WebSocket channel.
