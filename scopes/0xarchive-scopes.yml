note: >-
  These scopes govern the hosted MCP surface ONLY, not the REST API. The REST API uses an
  X-API-Key header with no scope model at all - 0-working/derive-oauth-scopes.py correctly found
  zero oauth2 securitySchemes in the OpenAPI, because there are none. The scopes below are read
  from the provider's live RFC 8414 authorization-server metadata, which is why this file is
  method: searched rather than derived.
  Two facts about this list are worth reading together. First, the authorization server advertises
  SIX scopes covering market data, account bootstrap and creation, key read and revoke, and
  billing subscription - a full self-serve account-lifecycle scope set. Second, the MCP resource
  itself advertises exactly ONE of them: scopes_supported is ["mcp:market.read"] in the
  protected-resource metadata, and both the docs and llms.txt state twice that "the server
  advertises mcp:market.read only". So an agent connecting to the hosted MCP today gets read-only
  market data and nothing else; the remaining five scopes exist at the authorization server but
  are not reachable through the MCP resource. That is a deliberately narrow blast radius for an
  autonomous client, and it should be described as such rather than as five missing capabilities.
