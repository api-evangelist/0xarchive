note: >-
  This is NOT an AsyncAPI document and no canonical AsyncAPI pointer is claimed for it. 0xArchive
  publishes no machine-readable event contract - the provider says so itself on the schema page:
  "REST route map stays in OpenAPI; WebSocket message shape lives here until a standalone machine
  contract is published." The event surface is nevertheless real, substantial and carefully
  documented in prose and tables, so this file captures the command/event vocabulary and the
  channel catalog as data. It is the one clear artifact gap in an otherwise unusually complete
  agent surface: everything else this provider ships is machine-readable, and its streaming API
  is not. The provider also publishes no webhooks or callbacks of any kind - this is a
  client-initiated streaming surface only.
endpoint:
  url: wss://api.0xarchive.io/ws
  alternate: wss://stream.0xarchive.io/ws
  alternate_source: changelog 2.1.0 (2026-05-04) names both hosts for the liquidations channels
  auth: 'Authorization: Bearer <API_KEY> during the handshake'
  auth_legacy: >-
    A ?apiKey= query parameter still works but the docs mark it compatibility-only for private
    server-side scripts and warn against browser-facing URLs and logs.
  model: One connection carries both live subscriptions and historical replay.
  tier_access: WebSocket is available on every tier including Free; subscription counts and replay speed are tier-scoped.
client_commands:
- op: subscribe
  purpose: Start a live stream for one channel
  required: [op, channel]
  conditional: symbol for coin-specific channels
- op: unsubscribe
  purpose: Stop a live stream
  required: [op, channel]
- op: replay
  purpose: Replay a historical stream window
  required: [op, one of channel or channels, symbol, start]
  optional: [end, speed]
- op: replay.pause
  purpose: Pause standard or core L4 replay
  required: [op]
- op: replay.resume
  purpose: Resume standard or core L4 replay
  required: [op]
- op: replay.seek
  purpose: Move standard replay to a timestamp
  required: [op, timestamp]
  note: Standard replay only - core L4 replay REJECTS seek.
- op: replay.stop
  purpose: Stop standard or core L4 replay
  required: [op]
- op: ping
  purpose: Keep-alive where the client does not rely on native ping/pong
  required: [op]
server_events:
- type: subscribed
  purpose: Confirms a live subscription
- type: unsubscribed
  purpose: Confirms a stopped subscription
- type: data
  purpose: Live stream data for ordinary channels
- type: l4_snapshot
  purpose: Initial L4 state for an order-level channel
  client_action: Replace local L4 state for that channel.
- type: l4_batch
  purpose: Ordered L4 diffs following a snapshot
  client_action: >-
    Apply in order and stop on an unsafe sequence or block gap. An optional insert_before field
    means insert the new order ahead of that order id within its price level rather than appending.
- type: replay_started
  purpose: Confirms replay window and standard replay speed
- type: replay_snapshot
  purpose: Initial state before replay timeline data
- type: historical_data
  purpose: Replay timeline records
- type: historical_tick_data
  purpose: Lighter tick-mode checkpoint and deltas
  client_action: Apply the checkpoint before the deltas and preserve ordering metadata.
- type: replay_paused
  purpose: Confirms replay pause
- type: replay_resumed
  purpose: Confirms replay resume
- type: replay_completed
  purpose: Replay reached the configured end
- type: replay_stopped
  purpose: Confirms replay stop
- type: gap_detected
  purpose: Marks a missing or discontinuous interval
  client_action: Mark output incomplete or rebuild.
  note: >-
    A first-class gap event is the most agent-relevant thing on this surface. A replay consumer is
    told explicitly when the timeline is discontinuous rather than silently receiving a shorter
    series - so "incomplete" is a state the client can represent instead of a bug it has to detect.
- type: error
  purpose: Command, authentication, access or data error
naming_convention: >-
  Client commands use dotted names (replay.pause, replay.resume, replay.seek, replay.stop);
  server events use underscore names (replay_paused, replay_resumed, replay_snapshot,
  historical_data, replay_completed). The two vocabularies are deliberately distinct.
