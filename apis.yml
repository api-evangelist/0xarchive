aid: 0xarchive
name: 0xArchive
description: '0xArchive is a replayable market-data archive for two decentralised perpetuals venues, Hyperliquid
  and Lighter, delivered as one REST API, one WebSocket API that carries both live subscriptions and historical
  replay on a single connection, bulk Parquet export, and a hosted MCP server. Hyperliquid coverage is
  split into four route families - core perpetuals, Spot, HIP-3 builder perps and HIP-4 binary outcome
  markets - each with its own symbol format and its own set of available data types. Beyond order books,
  trades, candles, funding, open interest and liquidations, the archive reconstructs order-level depth
  that the venues do not serve directly: L4 for the Hyperliquid families and L3 for Lighter. Access is
  unusually flat - every plan including Free reaches every route family, schema and served depth, and
  plans gate capacity and Free''s rolling 30-day history window rather than route access. An agent can
  buy its own 30-day Build or Pro access with an x402 USDC payment on Base and receive an API key on settlement,
  with no human signup step.'
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
