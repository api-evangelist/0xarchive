openapi: 3.2.0
info:
  title: 0xArchive Webhooks - Subscriptions API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: Webhooks - Subscriptions
  description: 'Rules: one event type and one configuration delivered to one endpoint, including the pause state a rule carries and the routes that clear it.'
paths:
  /v1/webhooks/subscriptions:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Webhooks - Subscriptions
      summary: List webhook subscriptions
      description: Your rules across every endpoint, with their configuration and their pause state. A paused rule also carries `pause_message`, which says why it is paused and what clears it. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: listWebhookSubscriptions
      responses:
        '200':
          description: Your webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookSubscriptionArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Webhooks - Subscriptions
      summary: Create a webhook subscription
      description: Subscribe an endpoint to an event type. The configuration is checked against the event type's catalog declaration before anything is stored, so an unknown key, an undeclared parameter, an out of range value or a condition on a metric the event does not carry is refused rather than quietly dropped. The endpoint must be one of yours. Addresses used in the configuration must already be on your watched list. A plan without webhook delivery, or one already at its subscription cap, is refused with the reason and the way forward. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        '200':
          description: The new subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookSubscription'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/webhooks/subscriptions/resume:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    post:
      tags:
      - Webhooks - Subscriptions
      summary: Resume every paused subscription
      description: Put every paused rule on the account back into service in one call. The daily delivery limit is counted per account while the pause is written per rule, so one busy rule can pause all of them; this is how an account comes back without a call per rule. Nothing is buffered while a rule is paused, so the response hands back the window that was missed instead of replaying it. If nothing is paused, nothing changes and the response says so. If resuming would be undone within seconds, because the plan has no webhook delivery or today's budget is already spent, the request is refused with the reason rather than granted and reversed. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: resumeAllWebhookSubscriptions
      responses:
        '200':
          description: The rules that were put back into service, and the window they missed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookSubscriptionResumeAll'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Today's delivery budget is already spent, so the rules would pause again immediately. Resume after the budget resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 409
                error_code: conflict
                error: You are still at today's delivery limit. These rules would pause again immediately. Resume after 2026-09-21 00:00 UTC.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/webhooks/subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    patch:
      tags:
      - Webhooks - Subscriptions
      summary: Update a webhook subscription
      description: Edit a rule in place. A configuration you send replaces the stored one and is validated exactly as it was at create; `enabled` switches the rule on or off without touching its configuration. A field you leave out is left alone. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: updateWebhookSubscription
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription identifier.
        schema:
          type: string
          format: uuid
          example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
        example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: The updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookSubscription'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Webhooks - Subscriptions
      summary: Delete a webhook subscription
      description: Remove a rule. Its endpoint and any other rule pointing at it are untouched. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: deleteWebhookSubscription
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription identifier.
        schema:
          type: string
          format: uuid
          example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
        example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
      responses:
        '200':
          description: The subscription was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookAck'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/webhooks/subscriptions/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    post:
      tags:
      - Webhooks - Subscriptions
      summary: Resume a paused subscription
      description: Put one paused rule back into service. Nothing is buffered while a rule is paused, so the response hands back the window that was missed, how much of it was counted and what can be re-read from the REST routes, instead of replaying it. A rule that is already serving is left exactly as it is, with `gap` null. If resuming would be undone within seconds, because the plan has no webhook delivery or today's budget is already spent, the request is refused with the reason rather than granted and reversed. Your own on and off switch is never touched by a resume. Authenticate with an API key or a signed-in dashboard session. Costs no credits.
      operationId: resumeWebhookSubscription
      parameters:
      - name: id
        in: path
        required: true
        description: Subscription identifier.
        schema:
          type: string
          format: uuid
          example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
        example: 3c1f0a52-8d6b-4f0e-9b1a-6f2c4d8e9a10
      responses:
        '200':
          description: The subscription, and the window it missed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWebhookSubscriptionResume'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Today's delivery budget is already spent, so the rule would pause again immediately. Resume after the budget resets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 409
                error_code: conflict
                error: You are still at today's delivery limit. This rule would pause again immediately. Resume after 2026-09-21 00:00 UTC.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    ApiResponseWebhookAck:
      type: object
      description: API response for a webhook management call that returns nothing beyond confirmation.
      properties:
        success:
          type: boolean
          example: true
      required:
      - success
    ResponseMeta:
      type: object
      description: Response metadata. Every 2xx JSON response carries `meta.request_id`; list payloads add `count`; cursor-paged routes add `has_more` and, when another page follows, `next_cursor`; per-symbol routes add `symbol` and `venue`. Fields that do not apply to a route are omitted.
      properties:
        count:
          type: integer
          description: Number of records returned
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        next_cursor:
          type: string
          description: Opaque cursor for the next page, present exactly when `has_more` is `true`. Pass it back unchanged as `cursor` with the same filters. Do not parse or construct it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        finalized_through:
          type: string
          format: date-time
          description: 'Two-tier datasets (Lighter trades): data at or before this instant is final; later data is preliminary.'
        requested_end:
          type:
          - string
          - 'null'
          format: date-time
          description: The `end` the request asked for, echoed when it was clamped to `finalized_through`.
        clamped_to:
          type:
          - string
          - 'null'
          format: date-time
          description: The boundary the request's `end` was clamped to, when clamping occurred.
        preliminary_row_count:
          type:
          - integer
          - 'null'
          description: Number of preliminary rows in this response, on routes that intentionally serve preliminary data (Lighter `/recent`).
      required:
      - request_id
    WebhookSubscriptionCondition:
      type: object
      description: One condition on an event metric. The operator vocabulary is grouped by the metric's type; see `operators` on the event type.
      required:
      - metric
      - op
      properties:
        metric:
          type: string
          description: A metric declared by the event type.
          example: notional_usd
        op:
          type: string
          enum:
          - greater_than
          - greater_than_or_equal
          - less_than
          - less_than_or_equal
          - equal
          - not_equal
          - between
          - not_between
          - in
          - not_in
          - contains
          - not_contains
          - starts_with
          - ends_with
          - before
          - after
          - is_empty
          - is_not_empty
          description: Comparison to apply. Symbol spellings such as `>=` are accepted on the way in and stored in the canonical spelling shown here.
          example: greater_than_or_equal
        value:
          description: What to compare against. A number, string, boolean or RFC 3339 timestamp for a single value comparison; a two entry `[low, high]` list for `between` and `not_between`; a non-empty list for `in` and `not_in`. Omitted for `is_empty` and `is_not_empty`.
          example: 100000
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code. Branch on this value, not on the `error` text.


        **Contract codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_parameter` | 400 | A parameter failed to parse or validate. `param` names it and `valid_values` lists accepted values where the set is fixed. |

        | `invalid_symbol` | 400 | The symbol is not listed on this venue. |

        | `invalid_interval` | 400 | The `interval` (bucket width) is not one this route accepts. |

        | `invalid_cursor` | 400 | The `cursor` is malformed, stale, or was issued for other filters. Restart pagination without a cursor. Trades, liquidations, L2 and L4 diffs, order history and TP/SL routes currently return the first page for a malformed cursor instead. |

        | `invalid_time_range` | 400 | `start` is after `end`, or a time value could not be parsed. |

        | `range_before_coverage` | 400 | The whole requested range ends before the first instant this dataset is served from. |

        | `historical_range_exceeded` | 403 | The requested span is longer than the plan allows in one request or replay. |

        | `historical_depth_exceeded` | 403 | The request reaches further back than the plan''s history window. |

        | `unsupported_for_venue` | 404 | The venue does not offer this datatype. The message, `datatype` and `available_on` name where it is served. |

        | `route_not_found` | 404 | No route matches the path or method. `GET /v1/capabilities` lists the routes each venue serves. |

        | `not_found` | 404 | The route exists but the requested resource (for example an incident, endpoint or outcome id) does not. |

        | `unauthorized` | 401 | The API key is missing or invalid. |

        | `forbidden` | 403 | The key is valid but not allowed to make this request. |

        | `insufficient_credits` | 429 | The monthly credit allowance is spent (402 on pay-per-request routes). |

        | `rate_limited` | 429 | Too many requests or concurrent queries. Retry after the interval in the rate-limit headers. |

        | `conflict` | 409 | The request conflicts with the current state of the resource. |

        | `upstream_unavailable` | 503 | A dependency is unavailable or saturated. Retry shortly; the response carries `Retry-After`. |

        | `internal_error` | 500 | An unexpected server error. Quote `request_id` when contacting support. |


        **WebSocket only** (sent in `{"type":"error"}` messages, never by REST)


        | Code | Where | Meaning |

        |---|---|---|

        | `endpoint_unsupported` | WebSocket | This WebSocket endpoint does not serve the channel or operation. The message names the endpoint that does. |

        | `slow_consumer` | WebSocket | The connection fell behind a stream and messages were dropped. Re-subscribe, or restart the replay, to resynchronise. |


        **Route-specific codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `positions_unavailable` | 503 | Account positions are temporarily unavailable for this venue. |

        | `reconstruction_unavailable` | 503 | The as-of positions state for this instant cannot be reconstructed right now. |

        | `snapshot_advanced` | 409 | A positions market cursor pinned a snapshot that has since been replaced or expired. Restart pagination. |

        | `pagination_unavailable` | 503 | The next positions page cannot be served right now. Retry the same cursor shortly. |

        | `api_key_limit_reached` | 403 | The account already holds the maximum number of API keys for its plan. |

        | `wallet_requires_plan` | 402 | A wallet-authenticated key needs an active plan for this request. |

        | `wallet_account_required` | 403 | Wallet sign-in needs an existing account linked to the wallet. |

        | `wallet_free_signup_retired` | 410 | Free wallet sign-up is no longer offered. |

        | `account_disabled` | 403 | The account is disabled. |

        | `oauth_not_permitted` | 403 | This route is not available to OAuth access tokens. |

        | `insufficient_scope` | 403 | The OAuth access token lacks the scope this route requires. |


        **Legacy names.** Requests without `0xArchive-Version: 2026-10-01` keep the four names that predate the contract; with the header they receive the contract names instead.


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_query_params` | 400 | Legacy name of `invalid_parameter` (query parameter), or of `invalid_cursor` when the parameter is `cursor`, sent without the version header. |

        | `invalid_path_params` | 400 | Legacy name of `invalid_parameter` (path parameter), sent without the version header. |

        | `history_window_exceeded` | 403 | Legacy name of `historical_depth_exceeded`, sent without the version header. |

        | `request_range_exceeded` | 403 | Legacy name of `historical_range_exceeded`, sent without the version header. |


        Treat any value not listed here as a generic error of the HTTP status.'
      enum:
      - invalid_parameter
      - invalid_symbol
      - invalid_interval
      - invalid_cursor
      - invalid_time_range
      - range_before_coverage
      - historical_range_exceeded
      - historical_depth_exceeded
      - unsupported_for_venue
      - route_not_found
      - not_found
      - unauthorized
      - forbidden
      - insufficient_credits
      - rate_limited
      - conflict
      - upstream_unavailable
      - internal_error
      - endpoint_unsupported
      - slow_consumer
      - positions_unavailable
      - reconstruction_unavailable
      - snapshot_advanced
      - pagination_unavailable
      - api_key_limit_reached
      - wallet_requires_plan
      - wallet_account_required
      - wallet_free_signup_retired
      - account_disabled
      - oauth_not_permitted
      - insufficient_scope
      - invalid_query_params
      - invalid_path_params
      - history_window_exceeded
      - request_range_exceeded
      example: invalid_parameter
    WebhookResumeGap:
      type: object
      description: The window a resume just closed. Nothing is buffered while a rule is paused, so this describes what was missed rather than replaying it.
      required:
      - paused_at
      - resumed_at
      - replay_window
      - counted
      - note
      properties:
        paused_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start of the gap.
        resumed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: End of the gap.
        replay_window:
          type: object
          description: The gap as a window to re-read for yourself.
          properties:
            start:
              type:
              - string
              - 'null'
              format: date-time
              description: Window start.
            end:
              type:
              - string
              - 'null'
              format: date-time
              description: Window end.
        reason:
          type:
          - string
          - 'null'
          description: Cause of the pause that was cleared. Null on a bulk resume whose rules were paused for more than one reason; each rule then carries its own.
          example: deliveries_per_day_cap
        reasons:
          type: array
          items:
            type: string
          description: Distinct causes across the resumed rules. Present on a bulk resume only.
        pause_message:
          type:
          - string
          - 'null'
          description: The cause in plain words.
        suppressed_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Matches suppressed inside the window. Null when the rules were address scoped, because a paused address scoped rule is left out of the scan entirely and its occurrences were never looked at.
          example: 0
        counted:
          type: boolean
          description: Whether anything inside the window was counted. False means the count is null because nothing was looked at, not because nothing happened.
          example: true
        suppressed_first_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First suppressed match inside the window.
        suppressed_last_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent suppressed match inside the window.
        uncounted_subscriptions:
          type: integer
          description: How many of the resumed rules were address scoped, and therefore not counted. Present on a bulk resume only.
          example: 0
        note:
          type: string
          description: What can and cannot be recovered for the window, and how.
    ApiResponseWebhookSubscriptionResume:
      type: object
      description: API response for resuming one paused subscription.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WebhookSubscription'
        gap:
          allOf:
          - $ref: '#/components/schemas/WebhookResumeGap'
          description: The window the resume closed. Null when the rule was already serving, in which case nothing was changed.
        note:
          type: string
          description: Present only when nothing changed, to say why.
          example: This subscription was already active, so nothing changed.
    WebhookSubscriptionUpdateRequest:
      type: object
      description: Edit a rule in place. Send `filters` (or its alias `config`), `enabled`, or both; a field you leave out is left alone, and other keys are ignored. A configuration is validated exactly as on create. Send `{}` as the configuration to clear it. Changing the configuration never requires deleting and recreating the rule.
      properties:
        filters:
          allOf:
          - $ref: '#/components/schemas/WebhookSubscriptionConfig'
          description: New rule configuration.
        config:
          allOf:
          - $ref: '#/components/schemas/WebhookSubscriptionConfig'
          description: Alias of `filters`. Send one or the other.
        enabled:
          type: boolean
          description: Your own on and off switch for the rule.
          example: true
    ApiResponseWebhookSubscriptionArray:
      type: object
      description: API response containing your webhook subscriptions.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - success
      - data
      - meta
    WebhookSubscriptionCreateRequest:
      type: object
      description: A new rule. The configuration is validated against the event type's catalog declaration before anything is stored. Send the configuration as `filters` or under its alias `config` (not both). Any other top-level key is refused with a 400 that names it.
      required:
      - endpoint_id
      - event_type
      properties:
        endpoint_id:
          type: string
          format: uuid
          description: Endpoint that will receive this rule's deliveries.
        event_type:
          type: string
          description: Event type to subscribe to, from the catalog.
          example: market.liquidation
        filters:
          allOf:
          - $ref: '#/components/schemas/WebhookSubscriptionConfig'
          description: Rule configuration. Omit it for an empty configuration.
        config:
          allOf:
          - $ref: '#/components/schemas/WebhookSubscriptionConfig'
          description: Alias of `filters`. Send one or the other.
    ApiResponseWebhookSubscription:
      type: object
      description: API response containing one webhook subscription.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WebhookSubscription'
    WebhookSubscriptionConfig:
      type: object
      description: 'What a subscription matches on. Every key is checked against the event type''s catalog declaration, so an unknown key, an undeclared parameter or a condition on an undeclared metric is refused rather than ignored. The stored config is the normalised form: venues and addresses lowercased, declared parameters filled in at their defaults, and operators written in their canonical spelling.'
      properties:
        venue:
          description: Venue or venues to match, from the event type's `venues` list. Accepts a single string, a pipe separated string or a list. Omit to match every covered venue.
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          example: hyperliquid
        symbols:
          type: array
          items:
            type: string
          description: Instrument symbols to match. Omit to match every symbol.
          example:
          - BTC
          - ETH
        addresses:
          type: array
          items:
            type: string
          description: Wallets to match, for an address scoped event type. Every address must already be on your watched list. Omit to match all of them.
          example:
          - '0x6b9e773128f453f5c2c60935ee2de2cbc5390a24'
        params:
          type: object
          additionalProperties: true
          description: Parameter values for the event type, keyed by the parameter names it declares. A declared parameter you leave out is stored at its default. A declared parameter may also be written at the top level of the config.
          example:
            max_age_s: 3600
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscriptionCondition'
          description: Conditions on the event's metrics, all of which must hold for a delivery. At most 16 per subscription.
        min_notional_usd:
          type: number
          description: Shorthand for a `notional_usd` at-or-above condition, kept for compatibility. It is stored as a condition, and it is mirrored back here as the loosest notional lower bound the config carries.
          example: 100000
    WebhookSubscription:
      type: object
      description: 'A rule: one event type, one configuration, delivered to one endpoint.'
      required:
      - id
      - endpoint_id
      - event_type
      - filters
      - enabled
      - created_at
      - status
      - suppressed_count
      - last_suppressed_count
      properties:
        id:
          type: string
          format: uuid
          description: Subscription identifier.
        endpoint_id:
          type: string
          format: uuid
          description: Endpoint that receives this rule's deliveries.
        event_type:
          type: string
          description: Event type this rule subscribes to.
          example: market.liquidation
        filters:
          $ref: '#/components/schemas/WebhookSubscriptionConfig'
        enabled:
          type: boolean
          description: Your own on and off switch. Resuming a paused rule never changes it.
          example: true
        created_at:
          type: string
          format: date-time
          description: When the rule was created.
        status:
          type: string
          enum:
          - active
          - auto_paused
          description: '`active` is serving. `auto_paused` means delivery was paused for you and nothing is being sent; it stays paused until you resume it.'
          example: active
        pause_message:
          type: string
          description: Why this rule is paused and what clears it, in plain words. Present only while the rule is paused.
          example: This rule was paused because the account reached its Pro plan limit of 50000 webhook deliveries in a day. The daily allowance resets at 2026-09-21 00:00 UTC, and a paused rule does not restart with it. Resume it with POST /v1/webhooks/subscriptions/resume.
        paused_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start of the current gap. Null while the rule is serving.
        pause_reason:
          type:
          - string
          - 'null'
          description: Machine readable cause of the current pause, either `deliveries_per_day_cap` (the account reached its daily delivery limit) or `plan_no_webhooks` (the plan does not include webhook delivery). Null while the rule is serving. Render `pause_message` for people.
          example: deliveries_per_day_cap
        suppressed_count:
          type: integer
          format: int64
          description: 'Matches observed but not delivered since the current pause began. A lower bound, not a total: occurrences no active rule asked for are never looked at.'
          example: 0
        suppressed_first_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First suppressed match of the current pause.
        suppressed_last_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent suppressed match of the current pause.
        last_paused_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Start of the last pause that has already ended.
        last_resumed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When that pause ended.
        last_pause_reason:
          type:
          - string
          - 'null'
          description: Cause of the last pause that has already ended, in the same vocabulary as `pause_reason`.
        last_suppressed_count:
          type: integer
          format: int64
          description: Matches suppressed during the last pause that has already ended.
          example: 0
        last_suppressed_first_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First suppressed match of that pause.
        last_suppressed_last_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent suppressed match of that pause.
    ApiResponseWebhookSubscriptionResumeAll:
      type: object
      description: API response for resuming every paused subscription on the account.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        resumed_count:
          type: integer
          description: How many rules were put back into service.
          example: 8
        gap:
          allOf:
          - $ref: '#/components/schemas/WebhookResumeGap'
          description: The window the resume closed, across the rules it cleared. Null when nothing was paused.
        note:
          type: string
          description: Present only when nothing changed, to say why.
          example: Nothing on this account is paused, so nothing changed.
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 2
    ApiVersion:
      description: The contract version the response was shaped with. Present only when the request sent `0xArchive-Version`.
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  responses:
    Unauthorized:
      description: 'Authentication required: the API key is missing or invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: 401
            error_code: unauthorized
            error: Missing authentication credentials. Provide X-API-Key header or Bearer token.
            request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    NotFound:
      description: 'Not found. `not_found`: the resource id is unknown. `unsupported_for_venue`: the venue does not offer this datatype (`available_on` names where it is served). `route_not_found`: no route matches the path.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                success: false
                code: 404
                error_code: not_found
                error: Resource not found
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            unsupported_for_venue:
              value:
                success: false
                code: 404
                error_code: unsupported_for_venue
                error: Order flow is not offered on Hyperliquid spot. It is available on Hyperliquid (/v1/hyperliquid/orders/{symbol}/flow), HIP-3 (/v1/hyperliquid/hip3/orders/{symbol}/flow) and HIP-4 (/v1/hyperliquid/hip4/orders/{symbol}/flow).
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                venue: spot
                datatype: order_flow
                available_on:
                - venue: hyperliquid
                  route: /v1/hyperliquid/orders/{symbol}/flow
                - venue: hip3
                  route: /v1/hyperliquid/hip3/orders/{symbol}/flow
                - venue: hip4
                  route: /v1/hyperliquid/hip4/orders/{symbol}/flow
            route_not_found:
              value:
                success: false
                code: 404
                error_code: route_not_found
                error: No route matches GET /v1/not-a-route. GET /v1/capabilities lists the routes each venue serves.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            current_main:
              value:
                code: 404
                error: No L4 checkpoint available before requested timestamp
                error_code: not_found
                request_id: ad7df471-eb8a-477c-bd9f-c685a9825f5b
                success: false
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Error:
      description: Any other error. The body is an `ErrorResponse`; branch on `error_code`. A 503 (`upstream_unavailable`) carries `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstream_unavailable:
              value:
                success: false
                code: 503
                error_code: upstream_unavailable
                error: The service is temporarily unavailable. Retry shortly.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            internal_error:
              value:
                success: false
                code: 500
                error_code: internal_error
                error: Internal server error
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    RateLimited:
      description: Rate limit, concurrency limit or monthly credits exceeded. See `error_code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                success: false
                code: 429
                error_code: rate_limited
                error: Rate limit exceeded
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            insufficient_credits:
              value:
                success: false
                code: 429
                error_code: insufficient_credits
                error: Monthly credit limit exceeded. Please upgrade your plan.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                credits_used: 50000
                credits_limit: 50000
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Requests per second limit
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests this second
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    BadRequest:
      description: 'Invalid request: a parameter, symbol, interval, cursor or time range failed validation. See `error_code`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_parameter:
              value:
                success: false
                code: 400
                error_code: invalid_parameter
                error: Invalid side 'up'. Use buy or sell.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: side
                valid_values:
                - buy
                - sell
            invalid_symbol:
              value:
                success: false
                code: 400
                error_code: invalid_symbol
                error: The symbol 'ZZZ' does not exist. Please see /v1/hyperliquid/instruments for available symbols.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                param: symbol
            invalid_time_range:
              value:
                success: false
                code: 400
                error_code: invalid_time_range
                error: start must be <= end
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            legacy_invalid_query_params:
              value:
                success: false
                code: 400
                error_code: invalid_query_params
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            current_main:
              value:
                code: 400
                error: 'Failed to deserialize query string: limit: invalid digit found in string'
                error_code: invalid_query_params
                param: limit
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
                success: false
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
  parameters:
    ApiVersion:
      name: 0xArchive-Version
      in: header
      required: false
      description: 'Selects the 2026-10 response contract. Send `2026-10-01`; any dated version on or after it selects the same shapes. Without the header every response keeps its existing shape. With it:


        - The data quality routes, `/v1/status/coverage` and `/v1/symbols` answer the standard `{success, data, meta}` envelope.

        - Record times that are integer milliseconds by default become RFC 3339 UTC strings with millisecond precision, and the integer moves to a `*_ms` field: L4 resting-order `timestamp` (`timestamp_ms`), CVD buckets, HIP-3 oracle reads, Lighter and Lighter on Robinhood Chain liquidations and liquidation volume. Levels and trigger-levels `snapshot_ts` become RFC 3339 with `snapshot_ts_ms`.

        - Error bodies carry the contract `error_code` names: `invalid_parameter` instead of `invalid_query_params` and `invalid_path_params`, `historical_depth_exceeded` instead of `history_window_exceeded`, and `historical_range_exceeded` instead of `request_range_exceeded`; a malformed cursor that fails to parse answers 400 `invalid_cursor` instead of `invalid_query_params`. With `0xArchive-Version: 2026-10-01`, malformed cursors on trades, liquidations, L2 and L4 diffs, order history, TP/SL and order-flow routes answer 400 `invalid_cursor`. Without the header, the first six route families treat a malformed cursor as no cursor and return the first page; order flow answers 400 `invalid_query_params`. Malformed trade time inputs answer 400 `invalid_time_range` with the header and 400 `invalid_query_params` without it.


        The response echoes the selected version in its own `0xArchive-Version` header.'
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Get yours at https://0xarchive.io/dashboard
