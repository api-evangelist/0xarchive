openapi: 3.2.0
info:
  title: 0xArchive Data Quality API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: Data Quality
  description: 'Data quality monitoring: system status, coverage, incidents, latency, and SLA metrics. Every data quality route requires an API key.'
paths:
  /v1/data-quality/status:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get system status
      description: 'Get overall system health status including per-exchange and per-data-type status. Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getDataQualityStatus
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/StatusResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/coverage:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get coverage summary
      description: 'Get data coverage summary for supported venue families, including earliest/latest data, record counts, and completeness. Note: May take 30-60 seconds on first request (results are cached server-side for 5 minutes). Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getDataQualityCoverage
      responses:
        '200':
          description: Coverage summary
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/CoverageResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/CoverageResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/coverage/{exchange}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get exchange coverage
      description: 'Get data coverage for a specific exchange. Note: May take 30-60 seconds on first request (results are cached server-side for 5 minutes). Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getExchangeCoverage
      parameters:
      - name: exchange
        in: path
        required: true
        description: Exchange name
        schema:
          type: string
          enum:
          - hyperliquid
          - lighter
          - hip3
          - spot
          - hip4
          example: hyperliquid
      responses:
        '200':
          description: Exchange coverage
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/ExchangeCoverageResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/ExchangeCoverageResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/coverage/{exchange}/{symbol}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get symbol coverage with gaps
      description: 'Get data coverage for a specific symbol on an exchange, including gap detection showing periods where data may be missing. Supports optional `from`/`to` query params (Unix ms) to bound the gap detection window (default: last 30 days). Returns empirical data cadence when sufficient data is available. Historical coverage uses hour-level granularity. Note: May take 30-60 seconds on first request (gap detection results are cached server-side for 1 hour). Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getSymbolCoverage
      parameters:
      - name: exchange
        in: path
        required: true
        description: Exchange name
        schema:
          type: string
          enum:
          - hyperliquid
          - lighter
          - hip3
          - spot
          - hip4
          example: hyperliquid
      - name: symbol
        in: path
        required: true
        description: Symbol name (e.g., BTC, ETH)
        schema:
          type: string
          example: BTC
        example: BTC
      - name: from
        in: query
        required: false
        description: 'Start of gap detection window (Unix milliseconds). Default: now - 30 days.'
        schema:
          type: integer
          format: int64
          example: 1704067200000
      - name: to
        in: query
        required: false
        description: 'End of gap detection window (Unix milliseconds). Default: now.'
        schema:
          type: integer
          format: int64
          example: 1706745600000
      responses:
        '200':
          description: Symbol coverage with gaps
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/SymbolCoverageResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/SymbolCoverageResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/incidents:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: List incidents
      description: 'List data quality incidents with filtering and pagination. Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: listIncidents
      parameters:
      - name: status
        in: query
        description: Filter by incident status
        schema:
          type: string
          enum:
          - open
          - investigating
          - identified
          - monitoring
          - resolved
      - name: exchange
        in: query
        description: Filter by exchange
        schema:
          type: string
      - name: since
        in: query
        description: Only show incidents starting after this timestamp (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'Maximum results per page (default: 20, max: 100)'
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: offset
        in: query
        description: Pagination offset
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/IncidentsResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/IncidentsResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/incidents/{id}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get incident
      description: 'Get a specific incident by ID. Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getIncident
      parameters:
      - name: id
        in: path
        required: true
        description: Incident ID
        schema:
          type: string
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/Incident'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/Incident'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/latency:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get latency metrics
      description: 'Get current latency metrics for supported venue families including WebSocket, REST API, and data freshness. Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getLatencyMetrics
      responses:
        '200':
          description: Latency metrics
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/LatencyResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/LatencyResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/sla:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get SLA metrics
      description: 'Get SLA compliance metrics for a specific month including uptime, completeness, and latency targets vs actuals. Without `0xArchive-Version` the body is the route''s own object plus `success` and `meta.request_id`; with `0xArchive-Version: 2026-10-01` it is the standard envelope with that object under `data`.'
      operationId: getSlaMetrics
      parameters:
      - name: year
        in: query
        description: Year (defaults to current year)
        schema:
          type: integer
          example: 2026
      - name: month
        in: query
        description: Month 1-12 (defaults to current month)
        schema:
          type: integer
          minimum: 1
          maximum: 12
          example: 1
      responses:
        '200':
          description: SLA metrics
          content:
            application/json:
              schema:
                oneOf:
                - title: Default shape
                  description: 'Without `0xArchive-Version`: the route''s own object plus `success` and `meta.request_id`.'
                  allOf:
                  - $ref: '#/components/schemas/SlaResponse'
                  - $ref: '#/components/schemas/OutlierEnvelopeKeys'
                - title: Version 2026-10-01
                  description: 'With `0xArchive-Version: 2026-10-01`: the standard envelope, with the route''s own object under `data`.'
                  type: object
                  required:
                  - success
                  - data
                  - meta
                  properties:
                    success:
                      type: boolean
                      enum:
                      - true
                    data:
                      $ref: '#/components/schemas/SlaResponse'
                    meta:
                      $ref: '#/components/schemas/ResponseMeta'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /v1/data-quality/positions:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - Data Quality
      summary: Get account positions freshness
      description: 'Freshness of each account positions product: latest live and hourly snapshots, live age, and how far the change log is built and final. Lighter on Robinhood Chain is listed once its positions routes are public.'
      operationId: getPositionsFreshness
      parameters: []
      responses:
        '200':
          description: Positions freshness per product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePositionsFreshnessArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Positions, pagination, or an as-of reconstruction are temporarily unavailable (`error_code` `positions_unavailable`, `pagination_unavailable`, or `reconstruction_unavailable`). Retry shortly.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: 503
                error_code: positions_unavailable
                error: Account positions are not available right now.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    WebSocketLatency:
      type: object
      properties:
        current_ms:
          type: integer
        avg_1h_ms:
          type: integer
        avg_24h_ms:
          type: integer
        p99_24h_ms:
          type:
          - integer
          - 'null'
    DataTypeStatus:
      type: object
      description: Status of a data type
      properties:
        status:
          type: string
          enum:
          - operational
          - degraded
          - outage
          - maintenance
        completeness_24h:
          type: number
          description: Data completeness over last 24 hours (0-100)
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    Incident:
      type: object
      description: Data quality incident
      properties:
        id:
          type: string
          description: Unique incident ID
        status:
          type: string
          enum:
          - open
          - investigating
          - identified
          - monitoring
          - resolved
        severity:
          type: string
          enum:
          - minor
          - major
          - critical
        exchange:
          type:
          - string
          - 'null'
          description: Affected exchange
        data_types:
          type: array
          items:
            type: string
          description: Affected data types
        symbols_affected:
          type: array
          items:
            type: string
          description: Affected symbols
        started_at:
          type: string
          format: date-time
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_minutes:
          type:
          - integer
          - 'null'
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        root_cause:
          type:
          - string
          - 'null'
        resolution:
          type:
          - string
          - 'null'
        records_affected:
          type:
          - integer
          - 'null'
          format: int64
        records_recovered:
          type:
          - integer
          - 'null'
          format: int64
    SymbolCoverageResponse:
      type: object
      description: Per-symbol coverage response with gap detection
      required:
      - exchange
      - symbol
      - data_types
      properties:
        exchange:
          type: string
          description: Exchange name
        symbol:
          type: string
          description: Symbol name
        data_types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SymbolDataTypeCoverage'
    DataFreshness:
      type: object
      description: Data freshness metrics
      properties:
        orderbook_lag_ms:
          type:
          - integer
          - 'null'
        fills_lag_ms:
          type:
          - integer
          - 'null'
        funding_lag_ms:
          type:
          - integer
          - 'null'
        oi_lag_ms:
          type:
          - integer
          - 'null'
    ApiLatency:
      type: object
      properties:
        current_ms:
          type: integer
        avg_1h_ms:
          type: integer
        avg_24h_ms:
          type: integer
    SlaResponse:
      type: object
      description: SLA compliance response
      properties:
        period:
          type: string
          description: Period covered (e.g., '2026-01')
        sla_targets:
          $ref: '#/components/schemas/SlaTargets'
        actual:
          $ref: '#/components/schemas/SlaActual'
        incidents_this_period:
          type: integer
        total_downtime_minutes:
          type: integer
    ExchangeStatus:
      type: object
      description: Status of a single exchange
      properties:
        status:
          type: string
          enum:
          - operational
          - degraded
          - outage
          - maintenance
        last_data_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of last received data
        latency_ms:
          type:
          - integer
          - 'null'
          description: Current latency in milliseconds
    ResponseMeta:
      type: object
      description: Response metadata. Every 2xx JSON response carries `meta.request_id`; list payloads add `count`; cursor-paged routes add `has_more` and, when another page follows, `next_cursor`; per-symbol routes add `symbol` and `venue`. Fields that do not apply to a route are omitted.
      properties:
        count:
          type: integer
          description: Number of records returned
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        next_cursor:
          type: string
          description: Opaque cursor for the next page, present exactly when `has_more` is `true`. Pass it back unchanged as `cursor` with the same filters. Do not parse or construct it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        finalized_through:
          type: string
          format: date-time
          description: 'Two-tier datasets (Lighter trades): data at or before this instant is final; later data is preliminary.'
        requested_end:
          type:
          - string
          - 'null'
          format: date-time
          description: The `end` the request asked for, echoed when it was clamped to `finalized_through`.
        clamped_to:
          type:
          - string
          - 'null'
          format: date-time
          description: The boundary the request's `end` was clamped to, when clamping occurred.
        preliminary_row_count:
          type:
          - integer
          - 'null'
          description: Number of preliminary rows in this response, on routes that intentionally serve preliminary data (Lighter `/recent`).
      required:
      - request_id
