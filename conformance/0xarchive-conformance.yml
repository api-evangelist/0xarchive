- id: spectral
  name: Spectral ruleset (governance-as-code)
  conforms: true
  evidence:
    location: well-known/0xarchive-spectral-ruleset.yaml
    detail: >-
      0xArchive publishes its OWN Spectral ruleset at
      https://0xarchive.io/.well-known/spectral-ruleset.yaml, extending spectral:oas with five
      house rules that pin its production server to HTTPS, its auth header to X-API-Key, its
      termsOfService and contact email to canonical values, and require POST /v1/web3/subscribe
      to declare an empty security array so the x402 onboarding path cannot silently start
      requiring a pre-existing key. Publishing the rules a provider holds ITSELF to is rare -
      it lets a consumer verify the contract against the provider's own stated invariants.
- id: x402
  name: x402 machine payments (HTTP 402 over EIP-3009 USDC on Base)
  conforms: true
  evidence:
    location: plans/0xarchive-plans-pricing.yml
    detail: >-
      POST /v1/web3/subscribe declares a 402 response and takes a payment-signature header
      carrying an EIP-3009 signed transfer. A facilitator page is published at
      https://0xarchive.io/facilitator (HTTP 200), and the API host sets
      access-control-expose-headers: payment-required on every response so a browser client
      can read the challenge. This is an agent buying its own 30-day access without a human.
- id: siwe
  name: Sign-In With Ethereum (EIP-4361)
  conforms: true
  evidence:
    location: openapi/0xarchive-openapi.json
    detail: >-
      POST /v1/auth/web3/challenge issues a single-use SIWE challenge message and
      POST /v1/auth/web3/verify signs in an existing wallet account; both require no API key.
      Wallet-signed requests also drive key listing and revocation.
- id: eip3009
  name: EIP-3009 Transfer With Authorization
  conforms: true
  evidence:
    location: https://0xarchive.io/llms.txt
    detail: >-
      The x402 subscription flow is settled by an EIP-3009 signed USDC transfer on Base carried
      in the payment-signature header of POST /v1/web3/subscribe.
