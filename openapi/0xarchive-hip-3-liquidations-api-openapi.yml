  /v1/hyperliquid/hip3/liquidations/{symbol}/levels/history:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-3 - Liquidations
      summary: Get HIP-3 liquidation levels history
      description: 'Historical liquidation-levels snapshots (about every 5 minutes, retained from 2026-07-27), ascending by `snapshot_ts`. Cursor pagination: pass `start`/`end`/`limit` and follow `meta.next_cursor` as the `cursor` parameter. `summary=true` omits only `levels` while retaining `snapshot_ts`, `block_number`, `mid_price`, `total_long`, `total_short`, and `flagged_notional`.'
      operationId: getHip3LiquidationLevelsHistory
      parameters:
      - name: symbol
        in: path
        required: true
        description: Trading pair symbol.
        schema:
          type: string
          example: xyz:TSLA
        example: xyz:TSLA
      - name: start
        in: query
        description: 'Range start, inclusive. Default: 24 hours before end. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.'
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: end
        in: query
        description: 'Range end, inclusive. Default: now. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.'
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page. The page continues strictly after it.'
        schema:
          type: string
      - name: limit
        in: query
        description: Snapshots per page. Default 24, maximum 100. When a page is full, meta.next_cursor carries the cursor for the next page.
        schema:
          type: integer
          default: 24
          minimum: 1
          maximum: 100
      - name: summary
        in: query
        description: When true, omits only `levels` while retaining `snapshot_ts`, `block_number`, `mid_price`, `total_long`, `total_short`, and `flagged_notional`. Cheap way to discover which snapshots exist before fetching full histograms.
        schema:
          type: boolean
          default: false
      - name: range_pct
        in: query
        description: Percentage range around the snapshot mid/mark price. Clamped between 1 and 50. Default 10.
        schema:
          type: number
          default: 10
          minimum: 1
          maximum: 50
      - name: buckets
        in: query
        description: Number of price buckets. Clamped between 10 and 200. Default 50.
        schema:
          type: integer
          default: 50
          minimum: 10
          maximum: 200
      - name: side
        in: query
        description: Optional side filter. bid/buy/B keeps the long (or bid) side, ask/sell/A keeps the short (or ask) side; the other side is zeroed.
        schema:
          type: string
          enum:
          - bid
          - ask
          - buy
          - sell
          - B
          - A
      responses:
        '200':
          description: Get HIP-3 liquidation levels history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLiquidationLevelsHistory'
              examples:
