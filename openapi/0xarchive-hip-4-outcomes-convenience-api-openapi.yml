openapi: 3.2.0
info:
  title: 0xArchive HIP-4 Outcomes - Convenience API
  description: 'REST API for current and historical market data from Hyperliquid and Lighter. Hyperliquid coverage includes core perpetuals, Spot, HIP-3 builder perpetuals, and HIP-4 outcome markets. Lighter coverage includes two deployments: Lighter mainnet under /v1/lighter and Lighter on Robinhood Chain under /v1/rh-lighter. Account positions are available for Hyperliquid core, HIP-3, and both Lighter deployments. Coverage and access requirements vary by route. See https://docs.0xarchive.io/ for authentication, limits, and examples.'
  version: 1.9.0
  termsOfService: https://0xarchive.io/terms
  contact:
    name: 0xArchive Support
    url: https://0xarchive.io
    email: support@0xarchive.io
  license:
    name: Proprietary
    url: https://0xarchive.io/terms
servers:
- url: https://api.0xarchive.io
  description: Production API
security:
- ApiKeyAuth: []
tags:
- name: HIP-4 Outcomes - Convenience
  description: 'HIP-4 convenience endpoints: freshness, summary, and price history. `mark_price` for HIP-4 is an implied probability in [0,1], not a USD price.'
paths:
  /v1/hyperliquid/hip4/freshness/{symbol}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-4 Outcomes - Convenience
      summary: Get HIP-4 data freshness
      description: Check when HIP-4 order book, trade, and outcome-side open-interest data was last updated. The shared freshness envelope can describe funding and liquidations for other families; those buckets are omitted for HIP-4 because HIP-4 has no funding dataset or liquidation endpoint.
      operationId: getHip4Freshness
      parameters:
      - name: symbol
        in: path
        required: true
        description: HIP-4 coin id (e.g., `0` for outcome 0 Yes side, `1` for No side). The `#`-prefixed form (`#0`, `#1`) is also accepted.
        schema:
          type: string
          example: '0'
        example: '0'
      responses:
        '200':
          description: Data freshness for the coin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoinFreshness'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/hip4/summary/{symbol}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-4 Outcomes - Convenience
      summary: Get HIP-4 market summary
      description: 'Get a combined market summary for a HIP-4 outcome side: latest mark price (implied probability in [0,1] for HIP-4, NOT USD), mid price, outcome-side open interest, and 24h volume. The shared summary schema retains optional funding, premium, oracle-price, and liquidation fields for compatibility across venue families; those fields are omitted for HIP-4 because they are not applicable. HIP-4 has no funding dataset or liquidation endpoint.'
      operationId: getHip4Summary
      parameters:
      - name: symbol
        in: path
        required: true
        description: HIP-4 coin id (e.g., `0` for outcome 0 Yes side, `1` for No side). The `#`-prefixed form (`#0`, `#1`) is also accepted.
        schema:
          type: string
          example: '0'
        example: '0'
      responses:
        '200':
          description: Market summary for the coin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoinSummary'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/hyperliquid/hip4/prices/{symbol}:
    parameters:
    - $ref: '#/components/parameters/ApiVersion'
    get:
      tags:
      - HIP-4 Outcomes - Convenience
      summary: Get HIP-4 price history
      description: 'Get mark/mid price history for a HIP-4 outcome side. Lightweight projection of open interest data. Note: `mark_price` for HIP-4 outcomes is an implied probability in [0,1], not a USD price; same field name as perps because Hyperliquid upstream uses `markPx` for both. `oracle_price` is omitted for HIP-4 (outcomes have no oracle feed).'
      operationId: getHip4PriceHistory
      parameters:
      - name: symbol
        in: path
        required: true
        description: HIP-4 coin id (e.g., `0` for outcome 0 Yes side, `1` for No side). The `#`-prefixed form (`#0`, `#1`) is also accepted.
        schema:
          type: string
          example: '0'
        example: '0'
      - name: start
        in: query
        description: Start timestamp. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: end
        in: query
        description: End timestamp. Accepts Unix milliseconds or an RFC 3339 UTC string such as `2026-01-01T00:00:00Z`.
        schema:
          $ref: '#/components/schemas/TimeInput'
      - name: interval
        in: query
        description: Aggregation interval
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
      - name: limit
        in: query
        description: 'Maximum number of results (default: 100, max: 1000)'
        schema:
          type: integer
          default: 100
          maximum: 1000
      - name: cursor
        in: query
        description: 'Opaque pagination cursor: pass `meta.next_cursor` from the previous page unchanged, with the same filters. Omit it for the first page.'
        schema:
          type: string
      responses:
        '200':
          description: Price history data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePriceSnapshotArray'
          headers:
            0xArchive-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response. `code` repeats the HTTP status, `error_code` is the stable machine-readable code (see `ErrorCode`), `error` is a human-readable message, and `request_id` identifies the request for support. Validation failures add `param` and, where the accepted set is fixed, `valid_values`. A 404 for a datatype the venue does not offer (`unsupported_for_venue`) adds `venue`, `datatype` and `available_on`; any other unknown path answers 404 `route_not_found`.
      required:
      - success
      - code
      - error_code
      - error
      - request_id
      properties:
        success:
          type: boolean
          enum:
          - false
          description: Always `false` on an error.
        code:
          type: integer
          description: HTTP status code.
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error:
          type: string
          description: Human-readable message. Wording can change; do not parse it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support.
        param:
          type: string
          description: The parameter that failed validation, when one did.
          example: side
        valid_values:
          type: array
          items:
            type: string
          description: Accepted values of `param`, when the set is fixed.
          example:
          - buy
          - sell
        venue:
          type: string
          description: '`unsupported_for_venue` only: the venue the request asked.'
          example: spot
        datatype:
          type: string
          description: '`unsupported_for_venue` only: the datatype the request asked for, as `GET /v1/capabilities` names it.'
          example: order_flow
        available_on:
          type: array
          description: '`unsupported_for_venue` only: the venues and routes that serve the datatype.'
          items:
            type: object
            required:
            - venue
            - route
            properties:
              venue:
                type: string
                example: hyperliquid
              route:
                type: string
                example: /v1/hyperliquid/orders/{symbol}/flow
        credits_used:
          type: integer
          format: int64
          description: '`insufficient_credits` only: credits used this period.'
        credits_limit:
          type: integer
          format: int64
          description: '`insufficient_credits` only: the period''s credit allowance.'
        max_concurrent:
          type: integer
          description: '`rate_limited` concurrency refusals only: simultaneous queries the plan allows.'
        suggestion:
          type: object
          description: 'Present when the symbol exists on another venue: where to request it instead.'
          properties:
            venue:
              type: string
              example: hip3
            symbol:
              type: string
              example: xyz:TSLA
            endpoint:
              type: string
              example: /v1/hyperliquid/hip3/trades/xyz:TSLA
    ApiResponseCoinFreshness:
      type: object
      description: API response wrapping coin freshness data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CoinFreshness'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      description: Response metadata. Every 2xx JSON response carries `meta.request_id`; list payloads add `count`; cursor-paged routes add `has_more` and, when another page follows, `next_cursor`; per-symbol routes add `symbol` and `venue`. Fields that do not apply to a route are omitted.
      properties:
        count:
          type: integer
          description: Number of records returned
        has_more:
          type: boolean
          description: 'Cursor-paged routes: whether another page follows. `next_cursor` is present exactly when this is `true`. A final page can be empty when the previous page was exactly full; `has_more` is `false` on it.'
        next_cursor:
          type: string
          description: Opaque cursor for the next page, present exactly when `has_more` is `true`. Pass it back unchanged as `cursor` with the same filters. Do not parse or construct it.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        symbol:
          type: string
          description: 'Per-symbol routes: the canonical public symbol the response describes (for example `BTC`, `xyz:TSLA`, `HYPE-USDC`, `#0`).'
          example: BTC
        venue:
          type: string
          enum:
          - hyperliquid
          - hip3
          - hip4
          - spot
          - lighter
          - rh-lighter
          description: 'Per-symbol routes: the venue the response describes.'
          example: hyperliquid
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Used when the requested window ends before coverage begins for the symbol, and on CVD responses that are one page of several; may carry other advisories in future.
        finalized_through:
          type: string
          format: date-time
          description: 'Two-tier datasets (Lighter trades): data at or before this instant is final; later data is preliminary.'
        requested_end:
          type:
          - string
          - 'null'
          format: date-time
          description: The `end` the request asked for, echoed when it was clamped to `finalized_through`.
        clamped_to:
          type:
          - string
          - 'null'
          format: date-time
          description: The boundary the request's `end` was clamped to, when clamping occurred.
        preliminary_row_count:
          type:
          - integer
          - 'null'
          description: Number of preliminary rows in this response, on routes that intentionally serve preliminary data (Lighter `/recent`).
      required:
      - request_id
    TimeInput:
      description: 'An instant: Unix milliseconds, or an RFC 3339 string such as `2026-01-01T00:00:00Z` (encode a `+` offset as `%2B`). An unparsable value answers 400 `invalid_time_range`.'
      oneOf:
      - type: integer
        format: int64
        description: Unix milliseconds.
        example: 1767225600000
      - type: string
        format: date-time
        description: RFC 3339 instant.
        example: '2026-01-01T00:00:00Z'
    PriceSnapshot:
      type: object
      description: Price snapshot with family-applicable price fields. Optional mark, oracle, or mid fields may be omitted when that route family does not supply them.
      required:
      - timestamp
      properties:
        timestamp:
          type: string
          format: date-time
          description: Snapshot timestamp (UTC)
          example: '2026-02-23T12:00:00.000Z'
        mark_price:
          type:
          - string
          - 'null'
          description: Mark price
          example: '95000.50'
        oracle_price:
          type:
          - string
          - 'null'
          description: Oracle price
          example: '94998.25'
        mid_price:
          type:
          - string
          - 'null'
          description: Mid price
          example: '95000.00'
    CoinSummary:
      type: object
      description: Shared market-summary shape. Route families omit unsupported optional fields; consult the operation description for family-specific applicability.
      required:
      - symbol
      - coin
      - timestamp
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC
        coin:
          type: string
          description: Trading pair symbol (deprecated, use symbol instead)
          example: BTC
          deprecated: true
        timestamp:
          type: string
          format: date-time
          description: Summary timestamp (UTC)
          example: '2026-02-23T12:00:00.000Z'
        mark_price:
          type:
          - string
          - 'null'
          description: Current mark price
          example: '95000.50'
        oracle_price:
          type:
          - string
          - 'null'
          description: Current oracle price
          example: '94998.25'
        mid_price:
          type:
          - string
          - 'null'
          description: Current mid price
          example: '95000.00'
        funding_rate:
          type:
          - string
          - 'null'
          description: Current funding rate
          example: '0.00025'
        premium:
          type:
          - string
          - 'null'
          description: Current premium
          example: '0.0005'
        open_interest:
          type:
          - string
          - 'null'
          description: Current open interest
          example: '500000.00'
        volume_24h:
          type:
          - string
          - 'null'
          description: 24-hour notional volume
          example: '10000000.00'
        liquidation_volume_24h:
          type:
          - number
          - 'null'
          description: Total 24h liquidation volume in USD
          example: 2500000
        long_liquidation_volume_24h:
          type:
          - number
          - 'null'
          description: Long 24h liquidation volume in USD
          example: 1500000
        short_liquidation_volume_24h:
          type:
          - number
          - 'null'
          description: Short 24h liquidation volume in USD
          example: 1000000
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code. Branch on this value, not on the `error` text.


        **Contract codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_parameter` | 400 | A parameter failed to parse or validate. `param` names it and `valid_values` lists accepted values where the set is fixed. |

        | `invalid_symbol` | 400 | The symbol is not listed on this venue. |

        | `invalid_interval` | 400 | The `interval` (bucket width) is not one this route accepts. |

        | `invalid_cursor` | 400 | The `cursor` is malformed, stale, or was issued for other filters. Restart pagination without a cursor. Trades, liquidations, L2 and L4 diffs, order history and TP/SL routes currently return the first page for a malformed cursor instead. |

        | `invalid_time_range` | 400 | `start` is after `end`, or a time value could not be parsed. |

        | `range_before_coverage` | 400 | The whole requested range ends before the first instant this dataset is served from. |

        | `historical_range_exceeded` | 403 | The requested span is longer than the plan allows in one request or replay. |

        | `historical_depth_exceeded` | 403 | The request reaches further back than the plan''s history window. |

        | `unsupported_for_venue` | 404 | The venue does not offer this datatype. The message, `datatype` and `available_on` name where it is served. |

        | `route_not_found` | 404 | No route matches the path or method. `GET /v1/capabilities` lists the routes each venue serves. |

        | `not_found` | 404 | The route exists but the requested resource (for example an incident, endpoint or outcome id) does not. |

        | `unauthorized` | 401 | The API key is missing or invalid. |

        | `forbidden` | 403 | The key is valid but not allowed to make this request. |

        | `insufficient_credits` | 429 | The monthly credit allowance is spent (402 on pay-per-request routes). |

        | `rate_limited` | 429 | Too many requests or concurrent queries. Retry after the interval in the rate-limit headers. |

        | `conflict` | 409 | The request conflicts with the current state of the resource. |

        | `upstream_unavailable` | 503 | A dependency is unavailable or saturated. Retry shortly; the response carries `Retry-After`. |

        | `internal_error` | 500 | An unexpected server error. Quote `request_id` when contacting support. |


        **WebSocket only** (sent in `{"type":"error"}` messages, never by REST)


        | Code | Where | Meaning |

        |---|---|---|

        | `endpoint_unsupported` | WebSocket | This WebSocket endpoint does not serve the channel or operation. The message names the endpoint that does. |

        | `slow_consumer` | WebSocket | The connection fell behind a stream and messages were dropped. Re-subscribe, or restart the replay, to resynchronise. |


        **Route-specific codes**


        | Code | HTTP | Meaning |

        |---|---|---|

        | `positions_unavailable` | 503 | Account positions are temporarily unavailable for this venue. |

        | `reconstruction_unavailable` | 503 | The as-of positions state for this instant cannot be reconstructed right now. |

        | `snapshot_advanced` | 409 | A positions market cursor pinned a snapshot that has since been replaced or expired. Restart pagination. |

        | `pagination_unavailable` | 503 | The next positions page cannot be served right now. Retry the same cursor shortly. |

        | `api_key_limit_reached` | 403 | The account already holds the maximum number of API keys for its plan. |

        | `wallet_requires_plan` | 402 | A wallet-authenticated key needs an active plan for this request. |

        | `wallet_account_required` | 403 | Wallet sign-in needs an existing account linked to the wallet. |

        | `wallet_free_signup_retired` | 410 | Free wallet sign-up is no longer offered. |

        | `account_disabled` | 403 | The account is disabled. |

        | `oauth_not_permitted` | 403 | This route is not available to OAuth access tokens. |

        | `insufficient_scope` | 403 | The OAuth access token lacks the scope this route requires. |


        **Legacy names.** Requests without `0xArchive-Version: 2026-10-01` keep the four names that predate the contract; with the header they receive the contract names instead.


        | Code | HTTP | Meaning |

        |---|---|---|

        | `invalid_query_params` | 400 | Legacy name of `invalid_parameter` (query parameter), or of `invalid_cursor` when the parameter is `cursor`, sent without the version header. |

        | `invalid_path_params` | 400 | Legacy name of `invalid_parameter` (path parameter), sent without the version header. |

        | `history_window_exceeded` | 403 | Legacy name of `historical_depth_exceeded`, sent without the version header. |

        | `request_range_exceeded` | 403 | Legacy name of `historical_range_exceeded`, sent without the version header. |


        Treat any value not listed here as a generic error of the HTTP status.'
      enum:
      - invalid_parameter
      - invalid_symbol
      - invalid_interval
      - invalid_cursor
      - invalid_time_range
      - range_before_coverage
      - historical_range_exceeded
      - historical_depth_exceeded
      - unsupported_for_venue
      - route_not_found
      - not_found
      - unauthorized
      - forbidden
      - insufficient_credits
      - rate_limited
      - conflict
      - upstream_unavailable
      - internal_error
      - endpoint_unsupported
      - slow_consumer
      - positions_unavailable
      - reconstruction_unavailable
      - snapshot_advanced
      - pagination_unavailable
      - api_key_limit_reached
      - wallet_requires_plan
      - wallet_account_required
      - wallet_free_signup_retired
      - account_disabled
      - oauth_not_permitted
      - insufficient_scope
      - invalid_query_params
      - invalid_path_params
      - history_window_exceeded
      - request_range_exceeded
      example: invalid_parameter
    DataTypeFreshness:
      type: object
      description: Freshness information for a single data type
      properties:
        last_updated:
          type:
          - string
          - 'null'
          format: date-time
          description: When this data type was last updated for the coin
          example: '2026-02-23T12:00:00.000Z'
        lag_ms:
          type:
          - integer
          - 'null'
          description: Current lag in milliseconds between now and last update
          example: 1200
    CoinFreshness:
      type: object
      description: Shared route-family freshness shape. Unsupported data-type buckets may be omitted; consult the operation description for each family.
      required:
      - symbol
      - coin
      - exchange
      - measured_at
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC
        coin:
          type: string
          description: Trading pair symbol (deprecated, use symbol instead)
          example: BTC
          deprecated: true
        exchange:
          type: string
          description: Exchange name
          example: hyperliquid
        measured_at:
          type: string
          format: date-time
          description: When the freshness was measured
          example: '2026-02-23T12:00:00.000Z'
        orderbook:
          $ref: '#/components/schemas/DataTypeFreshness'
        trades:
          $ref: '#/components/schemas/DataTypeFreshness'
        funding:
          $ref: '#/components/schemas/DataTypeFreshness'
        open_interest:
          $ref: '#/components/schemas/DataTypeFreshness'
        liquidations:
          $ref: '#/components/schemas/DataTypeFreshness'
    ApiResponseCoinSummary:
      type: object
      description: API response wrapping a market summary
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CoinSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ApiResponsePriceSnapshotArray:
      type: object
      description: API response containing an array of price snapshots
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PriceSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 2
    ApiVersion:
      description: The contract version the response was shaped with. Present only when the request sent `0xArchive-Version`.
      schema:
        type: string
        enum:
        - '2026-10-01'
        example: '2026-10-01'
  responses:
    Unauthorized:
      description: 'Authentication required: the API key is missing or invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: 401
            error_code: unauthorized
            error: Missing authentication credentials. Provide X-API-Key header or Bearer token.
            request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Forbidden:
      description: The request is outside the plan's history window or per-request span, or the key is not allowed to make it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            historical_depth_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_depth_exceeded
                error: 'Your plan includes the most recent 30 days of history: this request starts at 2026-01-01T00:00:00Z, before the earliest allowed timestamp 2026-08-30T00:00:00Z. Requests cannot be chunked across the age boundary.'
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            historical_range_exceeded:
              value:
                success: false
                code: 403
                error_code: historical_range_exceeded
                error: Maximum range is 30 days per request on your plan. Requested range is 45 days.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    Error:
      description: Any other error. The body is an `ErrorResponse`; branch on `error_code`. A 503 (`upstream_unavailable`) carries `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            upstream_unavailable:
              value:
                success: false
                code: 503
                error_code: upstream_unavailable
                error: The service is temporarily unavailable. Retry shortly.
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
            internal_error:
              value:
                success: false
                code: 500
                error_code: internal_error
                error: Internal server error
                request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        0xArchive-Version:
          $ref: '#/components/headers/ApiVersion'
    RateLimited:
      description: Rate limit, concurrency limit or monthly credits exceeded. See `error_code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                success: false
                code: 429
                error_code: rate_limited
