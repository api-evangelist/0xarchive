note: >-
  A genuinely good changelog: every entry carries a semantic version, an exact date, an explicit
  change class (Breaking Change / New Feature / Improvement), and a bulleted list of what did and
  did NOT change - including, repeatedly, sentences whose only job is to tell a reader what was
  left alone ("No data was removed", "Monthly allowances unchanged", "REST, WebSocket, the SDKs,
  the CLI, and the Claude Code Skill are unaffected"). The product changelog version (2.8.0) is a
  separate track from the OpenAPI contract version (1.6.1) and from each package's own version;
  the entries state which contract and SDK versions accompany each release.
