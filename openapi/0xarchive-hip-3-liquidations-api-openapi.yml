components:
  schemas:
    Error:
      type: object
      description: Error response
      properties:
        code:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Error message
        error_code:
          type: string
          description: 'Machine-readable error code. Common values: `invalid_query_params` (a query parameter failed to parse or validate) and `invalid_path_params` (a path parameter failed to parse). Other endpoint-specific codes exist; treat unknown codes as generic errors of the given HTTP status.'
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
    LiquidationLevelsHistoryItem:
      type: object
      description: One historical liquidation-levels snapshot. levels is omitted when summary=true.
      required:
      - snapshot_ts
      - block_number
      - mid_price
      - total_long
      - total_short
      - flagged_notional
      properties:
        snapshot_ts:
          type: string
        block_number:
          type: integer
          format: int64
        mid_price:
          type: number
        total_long:
          type: number
        total_short:
          type: number
        flagged_notional:
          type: number
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LiquidationLevelBucket'
    ApiResponseLiquidationLevels:
      type: object
      description: API response containing projected forced-liquidation levels for one snapshot.
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/LiquidationLevelsData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    ApiResponseLiquidationLevelsHistory:
      type: object
      description: Paginated historical liquidation-levels snapshots, ascending by snapshot_ts. When a page is full, meta.next_cursor carries the cursor for the next page.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/LiquidationLevelsHistoryItem'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    LiquidationLevelsData:
      type: object
      description: Projected forced-liquidation levels computed from clearinghouse positions and margin state (positions plus maintenance-margin tiers), aggregated into price buckets around the snapshot mark price. Snapshots are computed roughly every 5 minutes; snapshot_ts identifies the snapshot served.
      required:
      - mid_price
      - snapshot_ts
      - block_number
      - total_long
      - total_short
      - flagged_notional
      - source
      - levels
      properties:
        mid_price:
          type: number
          description: Mark price at the snapshot, center of the requested range.
          example: 64215
        snapshot_ts:
          type: string
          description: UTC snapshot time the levels reflect. Treat snapshots older than 2 hours as stale.
        block_number:
          type: integer
          format: int64
          description: Hyperliquid block height the snapshot reflects.
        total_long:
          type: number
          description: Total long notional at risk across the whole book, not only the returned window.
        total_short:
          type: number
          description: Total short notional at risk across the whole book.
        flagged_notional:
          type: number
          description: Notional reported in totals but computed approximately or not assigned to a returned bucket. For HIP-3, cross-margined exposure is reported here and excluded from buckets.
        source:
          type: string
          enum:
          - raw
          - histogram
          description: Snapshot storage form used to answer the request. raw means query-time bins over stored fine-grained levels; histogram means proportional re-binning of a retained base histogram.
        source_bin_width:
          type: number
          description: Stored source-bin width in price units. Present only when source is histogram.
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LiquidationLevelBucket'
    LiquidationLevelBucket:
      type: object
      description: One price bucket of projected forced-liquidation exposure.
      required:
      - price
      - long_notional
      - short_notional
      - long_count
      - short_count
      properties:
        price:
          type: number
          description: Bucket center price.
        long_notional:
          type: number
          description: USD notional of long positions projected to liquidate in this bucket.
        short_notional:
          type: number
          description: USD notional of short positions projected to liquidate in this bucket.
        long_count:
          type: integer
          description: Number of long positions in this bucket.
        short_count:
          type: integer
          description: Number of short positions in this bucket.
    ApiMeta:
      type: object
      description: Response metadata
      properties:
        count:
          type: integer
          description: Number of records returned
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for pagination (timestamp). Use this value as the `cursor` parameter to fetch the next page of results.
        request_id:
          type: string
          format: uuid
          description: Unique request ID for support
        coverage_from:
          type: string
          format: date-time
          description: Earliest coverage for the requested symbol and data type. Present only when the requested window ends before coverage begins.
        notice:
          type: string
          description: Human-readable advisory about the response. Currently used when the requested window ends before coverage begins for the symbol; may carry other advisories in future.
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            error: Missing or invalid API key. Provide X-API-Key header.
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            error: 'Failed to deserialize query string: limit: invalid digit found in string'
            error_code: invalid_query_params
            request_id: 3f2a9c71-5b0e-4d68-9a4c-7e1d2b6f8a05
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Requests per second limit
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests this second
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 429
            error: Rate limit exceeded
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Get yours at https://0xarchive.io/dashboard
externalDocs:
  description: 0xArchive Developer Docs
  url: https://docs.0xarchive.io/
