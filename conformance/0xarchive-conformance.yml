method: searched
source: >-
  Derived from the published OpenAPI at https://0xarchive.io/openapi.json, the live /.well-known/
  probe results in well-known/0xarchive-well-known.yml, and the provider's own documentation;
  every entry cites the exact location that carries the evidence.
sector: crypto market data / digital-asset trading infrastructure
standards:
- id: openapi
  name: OpenAPI Specification
  version: 3.0.3
  conforms: true
  evidence:
    location: openapi/0xarchive-openapi.json
    detail: >-
      A single 568KB OpenAPI 3.0.3 document covering 149 operations across 45 tags and 141
      component schemas, served at https://0xarchive.io/openapi.json (HTTP 200,
      application/json). info.version 1.6.1.
- id: oauth2
  name: OAuth 2.0 (RFC 6749) with PKCE (RFC 7636)
  conforms: true
  scope: hosted MCP server only
  evidence:
    location: well-known/0xarchive-oauth-authorization-server.json
    detail: >-
      Authorization-code grant with refresh_token, code_challenge_methods_supported ["S256"],
      response_types ["code"]. The REST API itself does NOT use OAuth - it uses an X-API-Key
      header - so this conformance is scoped to the MCP surface.
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence:
    location: well-known/0xarchive-oauth-authorization-server.json
    detail: >-
      Served at https://api.0xarchive.io/.well-known/oauth-authorization-server (HTTP 200).
      Declares issuer, authorization, token, revocation, registration and jwks endpoints,
      six mcp:* scopes, and authorization_response_iss_parameter_supported: true (RFC 9207).
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence:
    location: well-known/0xarchive-oauth-protected-resource.json
    detail: >-
      Served at https://mcp.0xarchive.io/.well-known/oauth-protected-resource (HTTP 200).
      Declares resource https://mcp.0xarchive.io/mcp, authorization_servers
      [https://auth.0xarchive.io], bearer_methods_supported ["header"] and scopes_supported
      ["mcp:market.read"]. The gated tools/list probe's 401 explicitly points the caller at the
      WWW-Authenticate header for this metadata, which is the RFC 9728 discovery flow working.
- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  evidence:
    location: well-known/0xarchive-oauth-authorization-server.json
    detail: >-
      registration_endpoint https://auth.0xarchive.io/oauth/register is advertised with
      token_endpoint_auth_methods_supported ["none"], so an MCP client can register itself
      without a pre-provisioned client_id. This is what makes the hosted MCP genuinely
      self-serve for an agent.
- id: rfc9116
  name: security.txt
  conforms: true
  evidence:
    location: well-known/0xarchive-security.txt
    detail: >-
      Served at https://0xarchive.io/.well-known/security.txt (HTTP 200, text/plain). Carries
      Contact, Expires (2027-08-30), Preferred-Languages and a self-referential Canonical field.
      No Policy, Encryption, Acknowledgments or Hiring field.
- id: rfc9727
  name: API Catalog (.well-known/api-catalog)
  conforms: true
  evidence:
    location: well-known/0xarchive-api-catalog.json
    detail: >-
      Served at https://0xarchive.io/.well-known/api-catalog with the correct
      application/linkset+json content type AND the RFC 9727 profile parameter
      (profile="https://www.rfc-editor.org/info/rfc9727"). Three anchors - the REST base, the
      WebSocket base and the MCP endpoint - each with service-desc, service-doc, service-meta
      and status link relations. This is a textbook implementation; most catalog entries that
      claim RFC 9727 omit the profile parameter.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence:
    location: errors/0xarchive-problem-types.yml
    detail: >-
      No application/problem+json media type appears anywhere in the contract. Errors use three
