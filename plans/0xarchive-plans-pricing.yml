alternative_payment:
  scheme: x402
  description: >-
    Autonomous 30-day Build or Pro access purchased by an agent with a USDC payment on Base
    (EIP-3009 signed transfer sent as a payment-signature header to POST /v1/web3/subscribe).
    No human signup step; an unknown wallet receives an account and API key only after
    successful settlement.
  facilitator: https://0xarchive.io/facilitator
  operation: web3Subscribe
