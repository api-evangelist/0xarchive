  provider publishes five additional non-registered /.well-known/ documents of its own
  (mcp/server-card.json, ai-catalog.json, api-onboarding, data-coverage.json, data-samples.json,
  spectral-ruleset.yaml), which are recorded here as extras[] because they are real published
  documents that no standard registry names.
